      ]},
      {pc:"7005", name:"Possession of Human Remains", desc:"Possessing detached body parts, organs, bones, or other human remains without lawful authority.", tiers:[{label:"", cls:"Felony", months:"15 mo", fine:"$3,500"}]},
      {pc:"7006", name:"Desecration of a Human Corpse", desc:"Dismembering, disfiguring, mutilating, or burning a corpse outside lawful forensic/medical procedure.", tiers:[{label:"", cls:"Capital Offense", months:"HUT", fine:"—"}]},
      {pc:"7007", name:"Pimping and Pandering", desc:"Causing, compelling, or procuring someone to engage in prostitution.", tiers:[{label:"", cls:"Felony", months:"25 mo", fine:"$1,250"}]},
      {pc:"7008", name:"Prostitution", desc:"Offering or paying for prostitution services.", tiers:[{label:"", cls:"Misdemeanor", months:"20 mo", fine:"$750"}]},
      {pc:"7009", name:"Illegal Gambling", desc:"Wagering or facilitating wagering on an uncertain event's outcome for gain.", tiers:[{label:"", cls:"Felony", months:"20 mo", fine:"$1,000"}]},
      {pc:"7010", name:"Aggressive Panhandling", desc:"Aggressively soliciting money or donations via badgering, threats, or intimidation.", tiers:[{label:"", cls:"Misdemeanor", months:"10 mo", fine:"$500"}]},
      {pc:"7011", name:"Public Intoxication", desc:"Being under the influence of alcohol or CDS in a public place.", tiers:[{label:"", cls:"Infraction", months:"0", fine:"$1,000"}]},
      {pc:"7012", name:"Public Indecency", desc:"Willfully exposing oneself in public or where others may be offended.", tiers:[{label:"", cls:"Misdemeanor", months:"10 mo", fine:"$3,500"}]},
      {pc:"7013", name:"Solicitation of a Crime", desc:"Requesting, paying, coercing, or encouraging someone to commit or be an accomplice to a crime.", tiers:[{label:"", cls:"Felony", months:"35 mo", fine:"$5,000"}]},
      {pc:"7014", name:"Obstructing Emergency Services", desc:"Hindering medical or fire personnel in performing their duties.", tiers:[{label:"", cls:"Felony", months:"20 mo", fine:"$2,500"}]},
      {pc:"7015", name:"Tainting of Food, Drink, Medicine, or Water", desc:"Willfully mixing poison/harmful substances into food, drink, medicine, or water, or falsely claiming to have done so.", tiers:[{label:"", cls:"Misdemeanor", months:"15 mo", fine:"$2,500"}]},
      {pc:"7016", name:"Bootlegging", desc:"Manufacturing, distilling, or possessing untaxed alcohol without a valid license. Manufacture/distillation counts regardless of quantity.", tiers:[
        {label:"3rd Degree — 6–10 units", cls:"Misdemeanor", months:"10 mo", fine:"$1,000"},
        {label:"2nd Degree — 11–30 units", cls:"Felony", months:"25 mo", fine:"$2,000"},
        {label:"1st Degree — 31+ units", cls:"Felony", months:"35 mo", fine:"$4,500"}
      ]}
    ]},

    { title:"Title 8 — Offenses Against Public Safety", items:[
      {pc:"8001", name:"Brandishing a Weapon", desc:"Drawing/exhibiting a deadly weapon in someone's presence without a self-defense justification. Holstered/slung open carry doesn't count.", tiers:[{label:"", cls:"Misdemeanor", months:"5 mo", fine:"$1,500"}]},
      {pc:"8002", name:"Unlawful Discharge of a Stun Gun or Deleterious Agent", desc:"Discharging a stun gun, bean bag, tear gas, or similar agent against someone without cause — especially an on-duty Government Employee.", tiers:[{label:"", cls:"Misdemeanor", months:"10 mo", fine:"$1,000"}]},
      {pc:"8003", name:"Negligent Discharge of a Firearm", desc:"Negligently discharging a firearm in a way that could injure someone or damage property.", tiers:[{label:"", cls:"Misdemeanor", months:"10 mo", fine:"$1,250"}]},
      {pc:"8004", name:"Criminal Discharge of a Firearm from a Vehicle", desc:"Willfully/maliciously discharging a firearm at a person or dwelling from a vehicle; injury isn't required, just the risk.", tiers:[{label:"", cls:"Felony", months:"25 mo", fine:"$2,000"}]},
      {pc:"8005", name:"Unlawful Possession of Ammunition", desc:"Possessing ammunition while prohibited from owning a firearm (charged only when the weapon itself isn't possessed).", tiers:[{label:"", cls:"Felony", months:"5 mo", fine:"$750"}]},
      {pc:"8006", name:"Criminal Possession of a Weapon", desc:"Possessing a weapon of the given class without a proper license, registration, or legal vendor purchase.", tiers:[
        {label:"Class 1", cls:"Felony", months:"10 mo", fine:"$1,500"},
        {label:"Class 2", cls:"Felony", months:"15 mo", fine:"$3,000"},
        {label:"Class 3", cls:"Felony", months:"25 mo", fine:"$7,000"},
        {label:"Class 4", cls:"Felony", months:"35 mo", fine:"$20,000"},
        {label:"Class 5", cls:"Felony", months:"45 mo", fine:"$30,000"}
      ]},
      {pc:"8007", name:"Criminal Possession of a Police Weapon", desc:"Possessing a government-issued weapon without proper license, registration, or state-employee authorization.", tiers:[
        {label:"Class 1", cls:"Felony", months:"40 mo", fine:"$20,000"},
        {label:"Class 2", cls:"Felony", months:"60 mo", fine:"$40,000"},
        {label:"Class 3", cls:"Felony", months:"90 mo", fine:"$80,000"}
      ]},
      {pc:"8008", name:"Possession of Illegal Weapon Modification Device", desc:"Possessing a device that illegally alters a weapon — full-auto/burst converters, suppressors, extended magazines, removable optics.", tiers:[{label:"", cls:"Misdemeanor", months:"10 mo", fine:"$1,000"}]},
      {pc:"8009", name:"Criminal Possession of an Explosive or Incendiary Device", desc:"Possessing, owning, or controlling any incendiary or explosive device.", tiers:[{label:"", cls:"Felony", months:"20 mo", fine:"$2,500"}]},
      {pc:"8010", name:"Criminal Sale of an Explosive or Incendiary Device", desc:"Selling, purchasing, or exchanging an explosive or incendiary device.", tiers:[{label:"", cls:"Felony", months:"35 mo", fine:"$6,500"}]},
      {pc:"8011", name:"Stockpiling of Explosive or Incendiary Devices", desc:"Possessing 5 or more incendiary/explosive devices on person or property.", tiers:[{label:"", cls:"Felony", months:"40 mo", fine:"$7,500"}]},
      {pc:"8012", name:"Trafficking of Explosive or Incendiary Devices", desc:"Manufacturing, selling, delivering, or intending to distribute explosive/incendiary devices above trafficking thresholds.", tiers:[
        {label:"2nd Degree — 7+", cls:"Felony", months:"1 yr", fine:"$30,000"},
        {label:"1st Degree — 10+", cls:"Capital Offense", months:"HUT", fine:"—"}
      ]},
      {pc:"8013", name:"Criminal Use of Explosives or Incendiary Device", desc:"Placing, using, or detonating an explosive/incendiary device against a person or property, or using it to intimidate/terrify.", tiers:[{label:"", cls:"Felony", months:"60 mo", fine:"$7,500"}]},
      {pc:"8014", name:"Criminal Use of a Weapon", desc:"Aiming, firing, or displaying a weapon to intimidate/coerce or cause injury, outside self-defense.", tiers:[
        {label:"Standard", cls:"Felony", months:"10 mo", fine:"$3,000"},
        {label:"At a Government Facility", cls:"Felony", months:"35 mo", fine:"$3,500"}
      ]},
      {pc:"8015", name:"Criminal Sale of a Weapon", desc:"Selling, purchasing, or exchanging a weapon of the given class without proper licensure.", tiers:[
        {label:"Class 1", cls:"Felony", months:"30 mo", fine:"$5,000"},
        {label:"Class 2", cls:"Felony", months:"40 mo", fine:"$10,000"},
        {label:"Class 3", cls:"Felony", months:"50 mo", fine:"$25,000"},
        {label:"Class 4", cls:"Felony", months:"60 mo", fine:"$35,000"},
        {label:"Class 5", cls:"Felony", months:"80 mo", fine:"$75,000"}
      ]},
      {pc:"8016", name:"Weapon Stockpiling", desc:"Possessing 6 or more Class 1–5 firearms on person or in one location, added on top of possession charges.", tiers:[{label:"", cls:"Felony", months:"30 mo", fine:"$5,000"}]},
      {pc:"8017", name:"Weapon Trafficking", desc:"Illicit trade/sale/transport of contraband firearms, ammo, or accessories (incl. large bladed weapons); brokers and straw purchasers are also guilty.", tiers:[
        {label:"3rd Degree — 5+", cls:"Felony", months:"1 yr", fine:"$25,000"},
        {label:"2nd Degree — 10+", cls:"Felony", months:"3 yrs", fine:"$60,000"},
        {label:"1st Degree — 20+", cls:"Capital Offense", months:"HUT", fine:"—"}
      ]},
      {pc:"8018", name:"Insurrection", desc:"Participating in or conspiring toward acts dangerous to life intended to alter/disrupt San Andreas's social, political, or economic order.", tiers:[{label:"", cls:"Capital Offense", months:"HUT", fine:"—"}]},
      {pc:"8019", name:"Mayhem", desc:"Extreme violence or destruction directly endangering life regardless of motive — mass destruction, assassination, kidnapping, or reckless/indiscriminate acts.", tiers:[{label:"", cls:"Capital Offense", months:"HUT", fine:"—"}]}
    ]},

    { title:"Title 9 — Offenses Involving the Operation of a Motor Vehicle", items:[
      {pc:"9001", name:"DUI", desc:"Operating a vehicle or bicycle while under the influence of drugs or alcohol.", tiers:[{label:"", cls:"Misdemeanor", months:"5 mo", fine:"$2,000", pts:"5"}]},
      {pc:"9002", name:"Evading", desc:"Fleeing law enforcement on foot or in a vehicle; reckless tier applies when done with willful/wanton disregard for safety.", tiers:[
        {label:"Standard", cls:"Misdemeanor", months:"5 mo", fine:"$1,500", pts:"2"},
        {label:"Reckless", cls:"Felony", months:"10 mo", fine:"$2,500", pts:"5"}
      ]},
      {pc:"9003", name:"Failure to Yield to Emergency Vehicle", desc:"Failing to pull over or slow for an active emergency vehicle.", tiers:[{label:"", cls:"Infraction", months:"0", fine:"$750", pts:"2"}]},
      {pc:"9004", name:"Failure to Obey Traffic Control Device", desc:"Disobeying a stop sign, light, yield sign, lane indicator, or regulatory sign.", tiers:[{label:"", cls:"Infraction", months:"0", fine:"$800", pts:"1"}]},
      {pc:"9005", name:"Operation of a Nonfunctional Vehicle", desc:"Driving an unsafe vehicle (smashed windows, missing doors) that risks occupants or the public.", tiers:[{label:"", cls:"Infraction", months:"0", fine:"$800", pts:"2"}]},
      {pc:"9006", name:"Operation of an Unroadworthy Vehicle", desc:"Driving without a visible license plate; the vehicle is impounded if within city limits.", tiers:[{label:"", cls:"Infraction", months:"0", fine:"$900", pts:"3"}]},
      {pc:"9007", name:"Negligent Driving", desc:"Driving with a lack of proper regard for safety or basic traffic rules.", tiers:[{label:"", cls:"Infraction", months:"0", fine:"$750", pts:"2"}]},
      {pc:"9008", name:"Reckless Driving", desc:"Driving with willful/wanton disregard for safety, likely to cause injury or death.", tiers:[{label:"", cls:"Misdemeanor", months:"10 mo", fine:"$1,250", pts:"2"}]},
      {pc:"9009", name:"Speeding", desc:"Driving over the posted speed limit; severity scales with how far over.", tiers:[
        {label:"3rd Degree — 1–25 mph over", cls:"Infraction", months:"0", fine:"$750", pts:"2"},
        {label:"2nd Degree — 26–50 mph over", cls:"Infraction", months:"0", fine:"$1,000", pts:"4"},
        {label:"1st Degree — 51–75 mph over (impound)", cls:"Misdemeanor", months:"5 mo", fine:"$1,500", pts:"8"},
        {label:"Felony — 75+ mph over (impound)", cls:"Felony", months:"15 mo", fine:"$2,000", pts:"10"}
      ]},
      {pc:"9010", name:"Unlicensed Operation of Vehicle", desc:"Operating a vehicle without a proper/valid license, or without a valid physical government ID.", tiers:[{label:"", cls:"Infraction", months:"0", fine:"$750", pts:"2"}]},
      {pc:"9011", name:"Illegal U-Turn", desc:"U-turning where prohibited, or crossing a yellow line to reverse direction mid-road.", tiers:[{label:"", cls:"Infraction", months:"0", fine:"$425", pts:"1"}]},
      {pc:"9012", name:"Illegal Passing", desc:"Passing via shoulder, median, or solid lines, or interfering with oncoming traffic.", tiers:[{label:"", cls:"Infraction", months:"0", fine:"$450", pts:"2"}]},
      {pc:"9013", name:"Failure to Maintain Lane", desc:"Failing to keep control of a vehicle within its lane.", tiers:[{label:"", cls:"Infraction", months:"0", fine:"$500", pts:"2"}]},
      {pc:"9014", name:"Illegal Turn", desc:"Turning without a full stop, against posted signs, from the wrong lane, or against a \"turn only\" indicator.", tiers:[{label:"", cls:"Infraction", months:"0", fine:"$400", pts:"1"}]},
      {pc:"9015", name:"Unauthorized Parking", desc:"Parking in fire lanes, red curbs, no-parking zones, handicap spots without authorization, sidewalks, or otherwise obstructing traffic.", tiers:[
        {label:"Standard", cls:"Infraction", months:"0", fine:"$1,000"},
        {label:"Government Property (impound)", cls:"Infraction", months:"0", fine:"$2,500"}
      ]},
      {pc:"9016", name:"Hit and Run", desc:"Leaving the scene of an accident you caused without giving identifying info or rendering aid.", tiers:[
        {label:"Misdemeanor — property damage", cls:"Misdemeanor", months:"10 mo", fine:"$1,000", pts:"5"},
        {label:"Felony — injury or death", cls:"Felony", months:"25 mo", fine:"$3,500", pts:"10"}
      ]},
      {pc:"9017", name:"Driving without Headlights", desc:"Failing to use headlights in low light.", tiers:[{label:"", cls:"Infraction", months:"0", fine:"$750", pts:"2"}]},
      {pc:"9018", name:"Street Racing", desc:"Participating in an unsanctioned race on a public road; license/vehicle may be impounded.", tiers:[{label:"", cls:"Felony", months:"20 mo", fine:"$5,000", pts:"10"}]},
      {pc:"9019", name:"Unlawful Use of a Motor Vehicle (Joyriding)", desc:"Taking a vehicle without consent, without intent to permanently deprive the owner of it.", tiers:[{label:"", cls:"Misdemeanor", months:"10 mo", fine:"$1,250"}]},
      {pc:"9020", name:"Jaywalking", desc:"Crossing a road outside a designated crosswalk while ignoring traffic signals.", tiers:[{label:"", cls:"Infraction", months:"0", fine:"$250"}]},
      {pc:"9021", name:"Improper Use of a Horn", desc:"Using a horn excessively or when not reasonably necessary for safety.", tiers:[{label:"", cls:"Infraction", months:"0", fine:"$200", pts:"1"}]},
      {pc:"9022", name:"Driving an Unregistered Vehicle", desc:"Operating an unregistered vehicle on a public road; subject to impound.", tiers:[{label:"", cls:"Infraction", months:"0", fine:"$800", pts:"1"}]},
      {pc:"9023", name:"Impeding Traffic", desc:"Illegally stopping on a road or driving intentionally slow to block normal traffic flow; vehicle subject to tow.", tiers:[{label:"", cls:"Infraction", months:"0", fine:"$600", pts:"1"}]},
      {pc:"9024", name:"Driving on a Sidewalk", desc:"Operating a vehicle on a sidewalk except to enter/exit adjacent property.", tiers:[{label:"", cls:"Infraction", months:"0", fine:"$800", pts:"1"}]},
      {pc:"9025", name:"Failure to Wear a Motorcycle Helmet", desc:"Riding a motorcycle (driver or passenger) without protective headgear while in motion.", tiers:[{label:"", cls:"Infraction", months:"0", fine:"$200", pts:"1"}]}
    ]},

    { title:"Title 10 — Offenses Involving the Well-Being of Wildlife", items:[
      {pc:"10001", name:"Hunting In Restricted Areas", desc:"Hunting outside the defined boundaries of a hunting area.", tiers:[{label:"", cls:"Infraction", months:"0", fine:"$1,500"}]},
      {pc:"10002", name:"Unlicensed Hunting or Fishing", desc:"Hunting or fishing without the appropriate license.", tiers:[{label:"", cls:"Infraction", months:"0", fine:"$1,500"}]},
      {pc:"10003", name:"Hunting Outside of Hunting Hours", desc:"Hunting outside the legal window of 05:00–19:30.", tiers:[{label:"", cls:"Infraction", months:"0", fine:"$1,000"}]},
      {pc:"10004", name:"Improper Storage of Fish", desc:"Not storing fish safely in a cooler or approved container for transport.", tiers:[{label:"", cls:"Infraction", months:"0", fine:"$500"}]},
      {pc:"10005", name:"Hunting With A Non-Hunting Weapon", desc:"Using any firearm other than a hunting rifle to hunt.", tiers:[{label:"", cls:"Misdemeanor", months:"10 mo", fine:"$1,500"}]},
      {pc:"10006", name:"Overhunting / Overfishing", desc:"Taking or possessing wildlife/fish in excess of SASP Fishing & Hunting Protocol limits.", tiers:[{label:"", cls:"Misdemeanor", months:"10 mo", fine:"$2,500"}]},
      {pc:"10007", name:"Animal Cruelty", desc:"Maliciously or intentionally harming, injuring, or killing an animal.", tiers:[{label:"", cls:"Felony", months:"15 mo", fine:"$5,000"}]},
      {pc:"10008", name:"Poaching", desc:"Unlawfully hunting, capturing, killing, transporting, or possessing protected/endangered species or their parts, per state conservation law.", tiers:[{label:"", cls:"Felony", months:"25 mo", fine:"$7,500"}]}
    ]},

    { title:"Title 11 — Offenses Involving Aircraft and Airspace", items:[
      {pc:"11001", name:"Failure to Maintain Aircraft Radio", desc:"Failing to stay on the required 919.1 frequency during flight, or failing to respond to law enforcement/ATC.", tiers:[{label:"", cls:"Infraction", months:"0", fine:"$1,000"}]},
      {pc:"11002", name:"Failure to Register Flight with Authorities", desc:"Failing to report a recreational flight via /311 before takeoff.", tiers:[{label:"", cls:"Infraction", months:"0", fine:"$500"}]},
      {pc:"11003", name:"Landing in an Unsafe Area", desc:"Helicopter landing outside designated areas or within 75m of a road/residence/structure; fixed-wing must use runways; float planes must stay 75m from bridges/vessels/swimmers.", tiers:[{label:"", cls:"Misdemeanor", months:"10 mo", fine:"$1,500"}]},
      {pc:"11004", name:"Flying an Unregistered Aircraft", desc:"Piloting an aircraft without valid registration (excludes properly-documented \"RENT\"/\"PEG\" rentals).", tiers:[{label:"", cls:"Misdemeanor", months:"15 mo", fine:"$1,500"}]},
      {pc:"11005", name:"Flying Too Low", desc:"Flying below the minimum altitude — 1,500 ft over city limits, 750 ft over county areas.", tiers:[{label:"", cls:"Infraction", months:"0", fine:"$1,000"}]},
      {pc:"11006", name:"Theft of an Aircraft", desc:"Unlawfully taking an aircraft without owner consent, for personal profit, purpose, or pleasure.", tiers:[
        {label:"Standard", cls:"Felony", months:"25 mo", fine:"$2,500"},
        {label:"Government Aircraft", cls:"Felony", months:"50 mo", fine:"$5,000"}
      ]},
      {pc:"11007", name:"Piloting without Proper License", desc:"Operating an aircraft without the required license.", tiers:[{label:"", cls:"Felony", months:"20 mo", fine:"$3,000"}]},
      {pc:"11008", name:"Flying into Restricted Airspace", desc:"Flying in unauthorized airspace when not responding to an emergency.", tiers:[{label:"", cls:"Felony", months:"20 mo", fine:"$4,000"}]}
    ]},

    { title:"Title 12 — Offenses Relating to Prisons and Prisoners", items:[
      {pc:"12001", name:"Possession or Manufacture of Weapons in Jail or Prison", desc:"A confined or in-transit person possessing/carrying a firearm, explosive, or makeshift weapon.", tiers:[{label:"", cls:"Felony", months:"20 mo", fine:"$3,000"}]},
      {pc:"12002", name:"Bringing CDS into Jail or Prison", desc:"Bringing or attempting to bring a controlled/dangerous substance into a correctional facility.", tiers:[{label:"", cls:"Felony", months:"25 mo", fine:"$3,500"}]},
      {pc:"12003", name:"Bringing Contraband into a Jail or Prison", desc:"Knowingly introducing unauthorized items — phones, electronics, tools — into a correctional facility.", tiers:[{label:"", cls:"Felony", months:"25 mo", fine:"$2,500"}]},
      {pc:"12004", name:"Bringing Firearms, Deadly Weapons, or Explosives into Jail or Prison", desc:"Knowingly bringing a firearm, deadly weapon, or explosive into a correctional facility.", tiers:[{label:"", cls:"Felony", months:"60 mo", fine:"$15,000"}]},
      {pc:"12005", name:"Bringing Alcohol Into a Jail or Prison", desc:"Knowingly bringing alcohol into a correctional facility without authorization.", tiers:[{label:"", cls:"Felony", months:"20 mo", fine:"$2,000"}]},
      {pc:"12006", name:"Unlawful Communication With an Inmate", desc:"Communicating with, or passing items/writing to or from, a confined person without permission.", tiers:[{label:"", cls:"Infraction", months:"0", fine:"$1,000"}]},
      {pc:"12007", name:"Possession of CDS in a Jail or Prison", desc:"Possessing a controlled/dangerous substance while incarcerated, without valid prescription.", tiers:[
        {label:"3rd Degree — 1–4 units / 31–42 marijuana", cls:"Misdemeanor", months:"20 mo", fine:"$2,000"},
        {label:"2nd Degree — 5–10 units / 43–80 marijuana", cls:"Felony", months:"50 mo", fine:"$5,000"},
        {label:"1st Degree — 11–100 units / 81–300 marijuana", cls:"Felony", months:"70 mo", fine:"$10,000"}
      ]},
      {pc:"12008", name:"Inciting a Riot in a Jail or Prison", desc:"Organizing a 4+ person assembly in custody that results in violent conduct or risks public harm.", tiers:[{label:"", cls:"Felony", months:"50 mo", fine:"$6,000"}]},
      {pc:"12009", name:"Burning in a Jail or Prison", desc:"Recklessly causing a fire (Reckless), or willfully/maliciously starting one to cause damage (Arson), inside a facility.", tiers:[
        {label:"Reckless", cls:"Misdemeanor", months:"30 mo", fine:"$3,000"},
        {label:"Arson", cls:"Felony", months:"50 mo", fine:"$9,000"}
      ]},
      {pc:"12010", name:"Misuse of Emergency Systems While Incarcerated", desc:"Requesting emergency response with no real emergency, or falsely reporting a crime, while incarcerated.", tiers:[{label:"", cls:"Misdemeanor", months:"20 mo", fine:"$2,000"}]},
      {pc:"12011", name:"Possession of Contraband in Jail or Prison", desc:"Possessing a weapon, controlled substance, explosives, or crime-conspiracy items while in a correctional facility.", tiers:[{label:"", cls:"Felony", months:"30 mo", fine:"$5,000"}]}
    ]}
  ],

  defGroups: [
    { title:"Title A — Sentencing", items:[
      {term:"P.C. 1101 Infraction", body:"A violation punishable by a fine only, no imprisonment."},
      {term:"P.C. 1102 Misdemeanor", body:"A violation punishable by fine and imprisonment, usually no more than 20 months."},
      {term:"P.C. 1103 Wobbler", body:"A charge that may be filed as either a misdemeanor or a felony, depending on the circumstances and the suspect's criminal history."},
      {term:"P.C. 1104 Felony", body:"A more serious crime, typically involving violence, usually punishable by more than 20 months."},
      {term:"P.C. 1105 Capital Offense", body:"A crime treated seriously enough to carry possible life imprisonment; expungement eligibility is reviewed at a Justice's discretion."},
      {term:"P.C. 1106 Accessory After The Fact", body:"Helping someone evade apprehension, trial, or punishment after a crime. Charged at half the time and fine of the crime aided."},
      {term:"P.C. 1107 Aiding and Abetting", body:"Intentionally helping someone commit a crime before it's complete. Charged at the full time and fine of the crime aided."},
      {term:"P.C. 1108 Sentencing — HUT", body:"Hold Until Trial. The charges must be reviewed in a San Andreas State court."},
      {term:"P.C. 1109 Sentencing — SACOR Discretion", body:"The San Andreas Chamber of Oversight and Reform has ultimate decision-making power in these circumstances."},
      {term:"P.C. 1110 Sentencing — Month", body:"OOC: 1 month is equivalent to 1 real-world minute."},
      {term:"P.C. 1111 Sentencing — Year", body:"OOC: 1 year is equivalent to 1 real-world day (entered in the equivalent number of months on the MDT)."}
    ]},
    { title:"Title B — Definitions", items:[
      {term:"P.C. 1200 Class 0-a Weapon", body:"Bladed/improvised melee — broken bottle, butterfly knife, candycane, dagger, hatchet, katana, knife, machete, screwdriver, switchblade, tiger blade, etc."},
      {term:"P.C. 1201 Class 0-b Weapon", body:"Blunt melee — bat, baton, brass knuckles, crowbar, hammer, golf club, nightstick, wrench, smoke grenade, flare, snowball, etc."},
      {term:"P.C. 1202 Class 1 Weapon", body:"Basic sidearms — bean bag gun, Glock 17, revolvers, hunting rifle, M1911, pepper spray, stun gun, paintball gun, etc."},
      {term:"P.C. 1203 Class 2 Weapon", body:"Upgraded pistols/SMGs — Desert Eagle, MP5, Uzi, Tech 9, sawn-off shotgun, Glock 18C/20, P90, etc."},
      {term:"P.C. 1204 Class 3 Weapon", body:"Rifles — AK-47, Carbine Rifle, M16, Special Carbine, Molotov, Advanced/Tactical Rifle, etc."},
      {term:"P.C. 1205 Class 4 Weapon", body:"Combat MG, M249, M60, M700, Precision Rifle."},
      {term:"P.C. 1206 Class 5 Weapon", body:"Fireworks Launcher, Flamethrower, Sticky Bomb."},
      {term:"P.C. 1207 CDS", body:"Controlled/dangerous substances — cocaine, heroin, marijuana, meth, psychedelics, opioids, and unprescribed medications, among others."},
      {term:"P.C. 1208 Firearm", body:"A weapon designed to expel a projectile via explosive, its frame/receiver, a silencer, or a destructive device."},
      {term:"P.C. 1209 Gang", body:"3 or more people sharing a common name, sign, color, or symbol, engaged in a pattern of criminal activity."},
      {term:"P.C. 1210 Gang Related", body:"A crime is gang-related if the suspect claims gang association, leaves gang markings, or wears gang identifiers."},
      {term:"P.C. 1211 Government Employees", body:"Police, corrections, EMS, DOJ, SAO, Chamber of Commerce, and other public officials — whether on or off duty."},
      {term:"P.C. 1212 Government Facility", body:"A building or location owned/operated by a government agency — PDs, prisons, military bases, city hall, courthouses, etc."},
      {term:"P.C. 1213 Government Property", body:"Any property issued to a Government Employee — weapons, ID, vehicles, gear, equipment."},
      {term:"P.C. 1213 Judiciary Member", body:"A State Clerk, Magistrate, Judge, or Justice employed by the San Andreas DOJ."},
      {term:"P.C. 1214 Nonlegal Currency", body:"Currency not in official circulation, untaxed, or marked stolen — loose notes, marked bills, inked money bags, etc."},
      {term:"P.C. 1215 Digital Asset", body:"A cryptocurrency or similar digital value substitute usable for payment, trade, or exchange."},
      {term:"P.C. 1216 Explosive Devices", body:"Devices producing destructive gas pressure via ignition — grenades, mines, pipe bombs, sticky bombs, modified fireworks, explosive ammo."},
      {term:"P.C. 1217 Incendiary Devices", body:"Devices producing destructive effects through combustion — flares, jerry cans, Molotovs, thermites (excludes normal lawful use of lighters/matches/flares)."},
      {term:"P.C. 1218 Vehicle", body:"A motor vehicle, trailer, snowmobile, aircraft, or vessel equipped for propulsion by mechanical means or sail."},
      {term:"P.C. 1219 Weapon", body:"Any firearm (loaded or not), or any object capable of producing death or serious injury as used. Classification is SACOR's discretion."},
      {term:"P.C. 1220 Speed Limit — City/Residential", body:"50 mph."},
      {term:"P.C. 1221 Speed Limit — Highways", body:"80 mph."},
      {term:"P.C. 1222 Time Served", body:"Custody time counted from arrival at a government facility (after intake) toward the sentence, at the arresting officer's discretion."},
      {term:"P.C. 1223 Aggravated", body:"The use of a deadly weapon in the circumstances of committing a crime."}
    ]},
    { title:"Title C — General Provisions", items:[
      {term:"P.C. 1300 Castle Law", body:"You may defend your business, residence, or property with reasonable escalating force and have no duty to flee an aggressor there. Retaliatory force must stay lawful."},
      {term:"P.C. 1301 Chain of Custody", body:"The last documented controller of property is responsible for its legal ramifications and must notify law enforcement if they lose control of it."},
      {term:"P.C. 1302 Civil Forfeiture", body:"Law enforcement may seize assets suspected of being involved in crime; owners must prove innocence to recover them."},
      {term:"P.C. 1303 Constructive Possession", body:"Having the means to control property without another's consent counts as possessing it."},
      {term:"P.C. 1304 Depraved Indifference", body:"A reckless act causing death, committed with extreme indifference to human life, constitutes murder."},

function renderPenalCode(){
  let groupsHTML = "";
  penalCodeData.offenseGroups.forEach((group, gi) => {
    let itemsHTML = "";
    group.items.forEach(item => {
      const tiersHTML = item.tiers.map(t => {
        const labelHTML = t.label ? `<span class="pc-tier-label">${t.label}</span>` : "";
        const ptsHTML = t.pts ? ` · ${t.pts} pts` : "";
        return `<div class="pc-tier">${labelHTML}<span class="pc-class ${pcClassSlug(t.cls)}">${t.cls}</span><span class="pc-tier-stat">${t.months} · ${t.fine}${ptsHTML}</span></div>`;
      }).join("");
      const searchBlob = (item.pc + " " + item.name + " " + item.desc).toLowerCase();
      itemsHTML += `<div class="pc-item" data-search="${searchBlob.replace(/"/g,'&quot;')}">
        <div class="pc-item-head"><span class="pc-num">PC ${item.pc}</span><span class="pc-name">${item.name}</span></div>
        <div class="pc-desc">${item.desc}</div>
        <div class="pc-tiers">${tiersHTML}</div>
      </div>`;
    });
    groupsHTML += `<details class="pc-group" data-kind="offense">
      <summary>${group.title} <span class="pc-count">${group.items.length}</span></summary>
      <div class="pc-group-body">${itemsHTML}</div>
    </details>`;
  });

  penalCodeData.defGroups.forEach(group => {
    let itemsHTML = "";
    group.items.forEach(item => {
      const searchBlob = (item.term + " " + item.body).toLowerCase();
      itemsHTML += `<div class="pc-def" data-search="${searchBlob.replace(/"/g,'&quot;')}">
        <div class="pc-def-term">${item.term}</div>
        <div class="pc-def-body">${item.body}</div>
      </div>`;
    });
    groupsHTML += `<details class="pc-group" data-kind="def">
      <summary>${group.title} <span class="pc-count">${group.items.length}</span></summary>
      <div class="pc-group-body">${itemsHTML}</div>
    </details>`;
  });

  modalBody.innerHTML = `
    <div class="pc-search-wrap">
      <input type="text" class="pc-search" id="pcSearchInput" placeholder="Search by PC number, offense, or keyword…">
    </div>
    <div class="pc-no-results" id="pcNoResults">No matches found.</div>
    <div id="pcGroups">${groupsHTML}</div>
  `;

  document.getElementById('pcSearchInput').addEventListener('input', e => filterPenalCode(e.target.value));
}

function filterPenalCode(query){
  const q = query.trim().toLowerCase();
  let anyVisible = false;
  document.querySelectorAll('#pcGroups .pc-item, #pcGroups .pc-def').forEach(el => {
    const text = el.dataset.search || "";
    const match = q === "" || text.indexOf(q) !== -1;
    el.classList.toggle('pc-row-hidden', !match);
    if(match) anyVisible = true;
  });
  document.querySelectorAll('#pcGroups .pc-group').forEach(g => {
    const visibleItems = g.querySelectorAll('.pc-item:not(.pc-row-hidden), .pc-def:not(.pc-row-hidden)');
    if(q === ""){
      g.open = false;
    } else {
      g.style.display = visibleItems.length ? "" : "none";
      g.open = visibleItems.length > 0;
    }
    if(q === "") g.style.display = "";
  });
  document.getElementById('pcNoResults').style.display = (q !== "" && !anyVisible) ? "block" : "none";
}

</script>
