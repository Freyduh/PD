<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SASP SOP — Field Reference</title>
<style>
  :root{
    --navy-deep: #0c1420;
    --navy: #121f33;
    --navy-panel: #17263e;
    --navy-line: #253a5c;
    --gold: #c9a227;
    --gold-dim: #8f7a3f;
    --paper: #ece7d8;
    --paper-dim: #a9b0bd;
    --red: #b3402c;
    --green: #4c8a5e;
    --amber: #c98a27;
    --blue-code: #3a5f96;
    --purple: #6a4c93;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--navy-deep);
    color:var(--paper);
    font-family:'Iowan Old Style','Georgia',serif;
    line-height:1.5;
  }
  .label-font{ font-family:'Helvetica Neue',Arial,sans-serif; letter-spacing:.04em; }

  header{
    display:flex;
    align-items:center;
    gap:18px;
    padding:22px 28px;
    border-bottom:1px solid var(--navy-line);
    background:linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    position:sticky;
    top:0;
    z-index:20;
  }
  .badge{
    width:46px;height:46px;flex-shrink:0;
    border:2px solid var(--gold);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:var(--gold);
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-weight:700;
    font-size:15px;
  }
  header h1{ font-size:20px; margin:0; font-weight:600; color:var(--paper); }
  header p{ margin:2px 0 0; font-size:12.5px; color:var(--paper-dim); font-family:'Helvetica Neue',Arial,sans-serif; }

  main{
    max-width:1180px;
    margin:0 auto;
    padding:34px 28px 90px;
  }
  .group-title{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:12px;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--gold-dim);
    margin:34px 0 14px;
    padding-bottom:8px;
    border-bottom:1px solid var(--navy-line);
  }
  .group-title:first-of-type{margin-top:6px;}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    gap:14px;
  }
  .card-btn{
    all:unset;
    cursor:pointer;
    background:var(--navy-panel);
    border:1px solid var(--navy-line);
    border-radius:6px;
    padding:18px 18px 16px;
    display:flex;
    flex-direction:column;
    gap:10px;
    min-height:118px;
    transition:border-color .15s, transform .15s, background .15s;
  }
  .card-btn:hover{
    border-color:var(--gold-dim);
    background:#1b2c47;
    transform:translateY(-2px);
  }
  .card-btn:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  .card-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .card-num{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:11px;
    color:var(--gold-dim);
  }
  .card-tag{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:10px;
    padding:2px 7px;
    border-radius:9px;
    background:rgba(201,162,39,.12);
    color:var(--gold);
  }
  .card-btn h3{
    margin:0;
    font-size:16.5px;
    color:var(--paper);
    font-weight:600;
    font-family:'Iowan Old Style','Georgia',serif;
  }
  .card-btn .teaser{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:12.5px;
    color:var(--paper-dim);
    line-height:1.4;
  }

  .overlay{
    position:fixed; inset:0;
    background:rgba(6,10,17,.72);
    backdrop-filter:blur(2px);
    display:none;
    align-items:flex-start;
    justify-content:center;
    padding:5vh 18px;
    z-index:100;
    overflow-y:auto;
  }
  .overlay.open{display:flex; animation:fadeBg .15s ease;}
  @keyframes fadeBg{from{opacity:0;} to{opacity:1;}}

  .modal{
    background:var(--navy);
    border:1px solid var(--navy-line);
    border-radius:8px;
    width:100%;
    max-width:840px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    animation:pop .18s ease;
  }
  @keyframes pop{from{opacity:0; transform:translateY(10px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);}}

  .modal-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:20px;
    padding:22px 26px 18px;
    border-bottom:1px solid var(--navy-line);
    position:sticky;
    top:0;
    background:var(--navy);
    border-radius:8px 8px 0 0;
  }
  .modal-head .panel-eyebrow{margin-bottom:6px;}
  .modal-head h2{ font-size:26px; margin:0; color:var(--paper); font-weight:600; }
  .modal-close{
    all:unset;
    cursor:pointer;
    width:32px;height:32px;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;
    color:var(--paper-dim);
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:18px;
    border:1px solid var(--navy-line);
  }
  .modal-close:hover{ color:var(--paper); border-color:var(--gold-dim); background:var(--navy-panel); }
  .modal-body{ padding:22px 26px 32px; }

  .panel-eyebrow{
    font-family:'Helvetica Neue',Arial,sans-serif;
    color:var(--gold-dim);
    font-size:12px;
    letter-spacing:.08em;
  }
  h3{ font-size:17px; color:var(--gold); margin:26px 0 10px; font-weight:600; }
  h3:first-child{margin-top:0;}

  p{color:var(--paper); max-width:70ch;}
  ul{padding-left:20px; margin:8px 0 18px;}
  li{margin-bottom:7px; max-width:66ch;}
  li::marker{color:var(--gold-dim);}

  .callout{
    background:var(--navy-panel);
    border-left:3px solid var(--gold);
    padding:14px 18px;
    margin:16px 0;
    border-radius:0 4px 4px 0;
    font-size:14.5px;
  }
  .callout.warn{border-left-color:var(--red);}
  .callout.warn strong{color:var(--red);}
  .callout strong{color:var(--gold);}

  .chip{
    display:inline-block;
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:11.5px;
    font-weight:700;
    letter-spacing:.03em;
    padding:2px 9px;
    border-radius:10px;
    color:#0c1420;
  }
  .chip.green{background:var(--green); color:#eef7ef;}
  .chip.amber{background:var(--amber); color:#241a02;}
  .chip.red{background:var(--red); color:#fbe9e5;}

  table{ width:100%; border-collapse:collapse; margin:14px 0 22px; font-size:13.5px; font-family:'Helvetica Neue',Arial,sans-serif; }
  th,td{ text-align:left; padding:9px 10px; border-bottom:1px solid var(--navy-line); vertical-align:top; }
  th{ color:var(--gold-dim); font-weight:600; font-size:11.5px; letter-spacing:.04em; text-transform:uppercase; }
  tr:hover td{background:rgba(201,162,39,0.04);}

  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }

  .pyramid-mini{ display:flex; flex-direction:column; gap:3px; margin:16px 0 24px; max-width:520px; }
  .pyr-row{ font-family:'Helvetica Neue',Arial,sans-serif; font-size:12.5px; padding:9px 14px; border-radius:3px; display:flex; justify-content:space-between; gap:12px; }
  .pyr-row span.desc{color:rgba(0,0,0,.65); text-align:right;}
  .pyr-1{background:#5a7a63; color:#eaf3ea; width:60%; align-self:center;}
  .pyr-2{background:#7a8fae; color:#eef1f6; width:70%; align-self:center;}
  .pyr-3{background:var(--amber); color:#241a02; width:82%; align-self:center;}
  .pyr-4{background:var(--red); color:#fbe9e5; width:96%; align-self:center;}

  .code-table{ width:100%; border-collapse:separate; border-spacing:0 4px; font-family:'Helvetica Neue',Arial,sans-serif; font-size:12.5px; }
  .code-table td{ padding:6px 10px; border:none; }
  .code-row{ background:var(--navy-panel); }
  .code-badge{
    display:inline-block;
    min-width:56px;
    text-align:center;
    padding:3px 8px;
    border-radius:4px;
    font-weight:700;
    font-size:11.5px;
    color:#0c1420;
  }
  .code-b{background:var(--blue-code); color:#eaf0fb;}
  .code-g{background:var(--green); color:#eef7ef;}
  .code-r{background:var(--red); color:#fbe9e5;}
  .code-cols{ display:grid; grid-template-columns:1fr 1fr; gap:0 22px; }
  @media (max-width:640px){.code-cols{grid-template-columns:1fr;}}

  .small-note{ font-size:12.5px; color:var(--paper-dim); font-family:'Helvetica Neue',Arial,sans-serif; margin:4px 0 14px; }

  .callout-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px 18px; margin-bottom:8px; }
  .callout-card{
    background:var(--navy-panel);
    border:1px solid var(--navy-line);
    border-radius:5px;
    padding:9px 12px;
  }
  .callout-card .head{
    display:flex; align-items:center; gap:9px;
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:12.5px;
    color:var(--paper);
    margin-bottom:5px;
  }
  .callout-card .ex{
    font-size:12px;
    font-style:italic;
    color:var(--paper-dim);
    font-family:'Iowan Old Style','Georgia',serif;
    line-height:1.4;
  }
  @media (max-width:640px){.callout-grid{grid-template-columns:1fr;}}

  .quiz-progress{ font-family:'Helvetica Neue',Arial,sans-serif; font-size:12px; color:var(--gold-dim); margin-bottom:12px; letter-spacing:.03em; }
  .quiz-progress-row{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; margin-bottom:12px;
  }
  .quiz-progress{ font-family:'Helvetica Neue',Arial,sans-serif; font-size:12px; color:var(--gold-dim); letter-spacing:.03em; margin-bottom:0; }
  .quiz-shuffle-btn{
    all:unset; cursor:pointer;
    font-family:'Helvetica Neue',Arial,sans-serif; font-size:11.5px;
    color:var(--paper-dim);
    border:1px solid var(--navy-line); border-radius:12px;
    padding:5px 11px;
    white-space:nowrap;
    transition:border-color .12s, color .12s;
  }
  .quiz-shuffle-btn:hover{ color:var(--gold); border-color:var(--gold-dim); }
  .quiz-prompt{ font-size:17px; margin-bottom:14px; color:var(--paper); font-weight:600; }
  .quiz-hint-btn{
    all:unset; cursor:pointer;
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:12px; color:var(--paper-dim);
    text-decoration:underline;
    margin-bottom:12px; display:inline-block;
  }
  .quiz-hint-btn:hover{color:var(--gold);}
  .quiz-hint-text{ font-size:12.5px; color:var(--paper-dim); margin:-4px 0 14px; font-family:'Helvetica Neue',Arial,sans-serif; }
  .quiz-option{
    all:unset; cursor:pointer; display:block; width:100%;
    box-sizing:border-box;
    padding:11px 15px; margin-bottom:8px;
    border:1px solid var(--navy-line); border-radius:6px;
    background:var(--navy-panel); color:var(--paper);
    font-family:'Helvetica Neue',Arial,sans-serif; font-size:13.5px;
    transition:border-color .12s, background .12s;
  }
  .quiz-option:hover:not(.disabled){ border-color:var(--gold-dim); }
  .quiz-option.correct{ border-color:var(--green); background:rgba(76,138,94,.15); }
  .quiz-option.incorrect{ border-color:var(--red); background:rgba(179,64,44,.15); }
  .quiz-option.disabled{ cursor:default; }
  .quiz-feedback{
    margin-top:6px; padding:13px 16px; border-radius:0 6px 6px 0;
    background:var(--navy-panel); border-left:3px solid var(--green);
    font-size:13.5px;
  }
  .quiz-feedback.wrong{ border-left-color:var(--red); }
  .quiz-feedback strong{ color:var(--gold); display:block; margin-bottom:3px; }
  .quiz-nav{ display:flex; justify-content:flex-end; margin-top:18px; }
  .quiz-btn{
    all:unset; cursor:pointer;
    background:var(--gold); color:#0c1420;
    font-family:'Helvetica Neue',Arial,sans-serif; font-weight:700; font-size:13px;
    padding:10px 20px; border-radius:5px;
  }
  .quiz-btn:hover{ opacity:.88; }
  .quiz-score{ text-align:center; padding:34px 10px 12px; }
  .quiz-score .big{ font-size:46px; color:var(--gold); font-weight:700; font-family:'Helvetica Neue',Arial,sans-serif; }
  .quiz-score p{ max-width:100%; }

  .modal.wide{ max-width:980px; }

  .pc-search-wrap{
    position:sticky; top:0; z-index:3;
    background:var(--navy);
    padding-bottom:12px; margin-bottom:10px;
    border-bottom:1px solid var(--navy-line);
  }
  .pc-search{
    width:100%; box-sizing:border-box;
    padding:11px 14px; border-radius:6px;
    border:1px solid var(--navy-line);
    background:var(--navy-panel); color:var(--paper);
    font-family:'Helvetica Neue',Arial,sans-serif; font-size:13.5px;
  }
  .pc-search::placeholder{ color:var(--paper-dim); }
  .pc-search:focus{ outline:none; border-color:var(--gold-dim); }
  .pc-no-results{ font-family:'Helvetica Neue',Arial,sans-serif; color:var(--paper-dim); font-size:13px; padding:14px 4px; display:none; }

  .pc-group{
    border:1px solid var(--navy-line); border-radius:6px;
    margin-bottom:10px; overflow:hidden;
  }
  .pc-group summary{
    cursor:pointer; list-style:none;
    padding:12px 16px;
    background:var(--navy-panel);
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-weight:600; font-size:13px; color:var(--gold);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .pc-group summary::-webkit-details-marker{ display:none; }
  .pc-group summary .pc-count{ font-size:11px; color:var(--paper-dim); font-weight:400; white-space:nowrap; }
  .pc-group-body{ padding:6px 14px 12px; }

  .pc-item{ padding:10px 0; border-bottom:1px solid var(--navy-line); }
  .pc-item:last-child{ border-bottom:none; }
  .pc-item-head{ display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; margin-bottom:4px; }
  .pc-num{ font-family:'Helvetica Neue',Arial,sans-serif; font-size:11px; color:var(--gold-dim); font-weight:700; white-space:nowrap; }
  .pc-name{ font-family:'Iowan Old Style','Georgia',serif; font-size:14.5px; font-weight:600; color:var(--paper); }
  .pc-desc{ font-family:'Helvetica Neue',Arial,sans-serif; font-size:12.5px; color:var(--paper-dim); margin-bottom:8px; max-width:72ch; }
  .pc-tiers{ display:flex; flex-direction:column; gap:4px; }
  .pc-tier{
    display:flex; align-items:center; gap:10px;
    font-family:'Helvetica Neue',Arial,sans-serif; font-size:12px;
    background:var(--navy-panel); border-radius:4px; padding:6px 10px;
  }
  .pc-tier-label{ color:var(--paper); min-width:150px; flex-shrink:0; }
  .pc-class{
    display:inline-block; padding:1px 8px; border-radius:9px;
    font-size:10px; font-weight:700; white-space:nowrap;
  }
  .pc-class.infraction{ background:rgba(58,95,150,.28); color:#a9c2ec; }
  .pc-class.misdemeanor{ background:rgba(76,138,94,.28); color:#9bdcaf; }
  .pc-class.felony{ background:rgba(179,64,44,.28); color:#eba396; }
  .pc-class.capital{ background:rgba(106,76,147,.32); color:#d2b3f5; }
  .pc-tier-stat{ color:var(--paper-dim); white-space:nowrap; }
  .pc-def{ padding:9px 0; border-bottom:1px solid var(--navy-line); }
  .pc-def:last-child{ border-bottom:none; }
  .pc-def-term{ font-family:'Helvetica Neue',Arial,sans-serif; font-weight:700; font-size:12.5px; color:var(--gold); margin-bottom:3px; }
  .pc-def-body{ font-family:'Helvetica Neue',Arial,sans-serif; font-size:12.5px; color:var(--paper-dim); max-width:72ch; }
  .pc-row-hidden{ display:none !important; }

  .caselaw-card{
    background:var(--navy-panel);
    border:1px solid var(--navy-line);
    border-left:3px solid var(--purple);
    border-radius:0 6px 6px 0;
    padding:14px 18px;
    margin-bottom:12px;
  }
  .caselaw-card h4{
    margin:0 0 6px;
    color:var(--gold);
    font-size:15px;
    font-weight:600;
  }
  .caselaw-card p{ margin:0; font-size:13.5px; }
  .caselaw-card a{ color:var(--gold); }

  @media (max-width:760px){
    main{padding:26px 16px 70px;}
    .two-col{grid-template-columns:1fr;}
    .modal{max-width:100%;}
  }

  footer{
    text-align:center;
    color:var(--paper-dim);
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:11.5px;
    padding:18px;
    border-top:1px solid var(--navy-line);
  }
</style>
</head>
<body>

<header>
  <div class="badge">SASP</div>
  <div>
    <h1>San Andreas State Police — SOP Field Reference</h1>
    <p>Tap a topic to open it · condensed from the full SOP document</p>
  </div>
</header>

<main id="main"></main>

<div class="overlay" id="overlay">
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <div>
        <div class="panel-eyebrow" id="modalEyebrow"></div>
        <h2 id="modalTitle"></h2>
      </div>
      <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<footer>Condensed reference generated from "EchoRP – SASP Full SOPs.pdf" + roster codes &amp; case-law sheets · Always defer to the source documents for exact wording.</footer>

<script>
const groups = [
  { title:"Conduct & Command", items:["intro","chain","discipline"] },
  { title:"Field Operations", items:["pursuits","force","radio","traffic"] },
  { title:"Enforcement & Custody", items:["crime","cleanup","gang","suspects","warrants"] },
  { title:"Quick Reference", items:["codes","caselaw"] },
  { title:"Legal Code", items:["penalcode"] },
  { title:"Practice", items:["quizUnits","quizSituations"] }
];

const sections = {
  intro:{
    title:"Introduction",
    eyebrow:"Who we are",
    teaser:"Candidate expectations, professionalism, off-duty rules.",
    body:`
      <h3>What's expected of a candidate</h3>
      <ul>
        <li><strong>Communication:</strong> speak factually (know case law, penal code, ten-codes), listen actively, and document everything clearly enough for a third party to follow.</li>
        <li><strong>Empathy:</strong> view situations from both sides.</li>
        <li><strong>Love of learning:</strong> show enthusiasm for training and the SOP itself.</li>
      </ul>
      <h3>On and off duty</h3>
      <ul>
        <li>Professionalism is expected at all times — on radio, with other officers, and off duty.</li>
        <li>You may carry your PD-issued weapon off duty, but never your tac weapon.</li>
        <li>A stolen off-duty weapon still must be reported, same as if lost on duty.</li>
        <li>Committing a criminal offense off duty can mean termination without warning.</li>
      </ul>
    `
  },
  chain:{
    title:"Chain of Command",
    eyebrow:"Rank structure",
    teaser:"Rank list and who handles what.",
    body:`
      <p>Always route questions to the lowest rank that can actually answer them. <strong>Corporal</strong> is the lowest supervisory rank.</p>
      <table>
        <tr><th>Rank</th><th>Role</th></tr>
        <tr><td>Chief / Sheriff / Commissioner</td><td>Runs the department, executive decisions</td></tr>
        <tr><td>Assistant Chief / Undersheriff</td><td>Executive decisions alongside command</td></tr>
        <tr><td>Captain</td><td>Oversees officers, enforces regs, interviews & hiring</td></tr>
        <tr><td>Lieutenant</td><td>Order, interviews, morale</td></tr>
        <tr><td>Sergeant</td><td>Keeps lower ranks in order, ride-alongs, patrol oversight</td></tr>
        <tr><td>Corporal</td><td>First supervisory rank — resource for lower ranks</td></tr>
        <tr><td>Senior Officer / Senior Deputy</td><td>Resource for officers under supervision</td></tr>
        <tr><td>Police Officer / Deputy</td><td>Active patrol, learning</td></tr>
        <tr><td>Cadet</td><td>Rides only with FTOs until probation ends</td></tr>
      </table>
    `
  },
  pursuits:{
    title:"Pursuits",
    eyebrow:"Vehicle chases",
    teaser:"PIT, PBS, spikes, swap-to-amber rules, pursuit codes.",
    body:`
      <h3>Hard rules</h3>
      <ul>
        <li><strong>Never</strong> enter a suspect's vehicle to stop them from evading — no exceptions.</li>
        <li>If a civilian is hit during a chase, a unit <strong>must stay back</strong> and check on them.</li>
        <li><strong>PIT:</strong> primary unit lightly taps the rear bumper. Never ram. Not allowed on bridges/overpasses. Not safe = don't do it (heavy traffic, gas stations, crowds).</li>
        <li><strong>PBS (Pit / Box / Spike):</strong> approved by a Senior Officer+ after a good reason (extra suspects interfering, vehicle swap, or a chase running 15+ minutes).</li>
        <li>Spikes only after PBS approval, never against large groups like a street race — communicate placement to avoid spiking your own units.</li>
      </ul>
      <h3>Code Amber vehicle swaps</h3>
      <div class="callout"><strong>4 swaps = automatic Code Amber.</strong> Warn suspects before the amber swap when possible, but a missed warning doesn't delay the call.</div>
      <table>
        <tr><th>Swap</th><th>Vehicle</th><th>Action</th></tr>
        <tr><td>—</td><td>Original vehicle</td><td>—</td></tr>
        <tr><td>1st swap</td><td>Second car</td><td>—</td></tr>
        <tr><td>2nd swap</td><td>Third car</td><td>Warn: next swap is amber</td></tr>
        <tr><td>3rd swap</td><td>Fourth car</td><td><span class="chip amber">CODE AMBER / SHOOT TIRES</span></td></tr>
      </table>
      <p>Swapping back into a previously-used vehicle, or being dropped off and picked up again, still counts as a swap. So does loading items into a vehicle without getting in yourself.</p>
      <h3>Special scenarios</h3>
      <ul>
        <li><strong>Foot chases:</strong> let them run a bit, don't instant-tackle. If they're running for a vehicle, tackle/tase before they reach it. Visible weapon → warn or use lethal force.</li>
        <li><strong>Helicopter escape:</strong> immediate Code Amber. Shoot rear/main rotor before takeoff; once airborne, shoot the fuselage until it heavily smokes.</li>

        <tr><td><span class="chip red">RED</span></td><td>Violent suspect, all else exhausted, or mass violence — Sergeant+ calls it (unless the suspect attacks an officer directly, then any rank can call it and use lethal force). Final resort.</td></tr>
      </table>

  force:{
    title:"Deadly Force",
    eyebrow:"Use of force",
    teaser:"Authorization, warning shots, moving vehicles, force triangle.",
    body:`
      <ul>
        <li>Only a <strong>Sergeant+</strong> can authorize deadly force, unless the suspect is an immediate danger to someone's life.</li>
        <li>Identify yourself and order the suspect to stop, with a <strong>verbal warning</strong> before deadly force — unless they've already fired on officers.</li>
        <li>Only authorized to protect someone from an imminent threat of death or great bodily harm, when lesser force would be insufficient.</li>
      </ul>
      <div class="callout warn"><strong>Never</strong> use a shot as a warning shot.</div>
      <h3>Shooting from a vehicle — avoid unless:</h3>
      <ul>
        <li>Fired upon from another vehicle while the suspect flees.</li>
        <li>Vehicle is code-ambered and you can't safely exit to shoot a tire.</li>
        <li>Immediate danger to officers or the public otherwise.</li>
      </ul>
      <h3>Shooting at a moving vehicle — only if:</h3>
      <ul>
        <li>Called Code Red by a supervisor.</li>
        <li>A Code Red suspect gets in and flees.</li>
        <li>Vehicle is deliberately trying to strike someone and other options are exhausted.</li>
        <li>Its use would otherwise unreasonably risk officers/bystanders anyway.</li>
      </ul>
      <h3>Use of force triangle</h3>
      <div class="pyramid-mini">
        <div class="pyr-row pyr-4"><span class="tag">Deadly force</span><span class="desc">Firearm — reasonable belief of imminent death/serious injury</span></div>
        <div class="pyr-row pyr-3"><span class="tag">Less-lethal</span><span class="desc">ECW, ASP/baton — physically aggressive behavior</span></div>
        <div class="pyr-row pyr-2"><span class="tag">Moderate / limited</span><span class="desc">Control holds, OC spray — resisting, non-compliant</span></div>
        <div class="pyr-row pyr-1"><span class="tag">No force</span><span class="desc">Verbal commands, presence — compliant subject</span></div>
      </div>
      <p style="font-size:13px;color:var(--paper-dim);">Rule of thumb: use the minimum force that neutralizes the immediate threat.</p>
    `
  },
  radio:{
    title:"Radio Communication",

    teaser:"Channel assignments, 10-code use, Signal 100.",
    body:`
      <ul>
        <li>Channels 1–100 are encrypted, government-only.</li>
        <li><strong>Radio 1</strong> = regular PD patrol · <strong>Radio 5</strong> = DOC · <strong>Radio 90–99</strong> = EMS</li>
        <li>Radio 16 (CID) and 20 (SAO) can't be used as TAC channels for calls.</li>

  traffic:{
    title:"Traffic Stops",
    eyebrow:"Stops & tickets",
    teaser:"Standard stop steps, Code 5 felony stop, license/plate rules.",
    body:`
      <h3>Standard stop — sequence</h3>
      <ul>
        <li>Call it in: callsign, location, heading, vehicle description, occupants, 77s/78s as needed. Run the plate first if possible.</li>
        <li>Confirm engine off + window down (loudspeaker helps).</li>
        <li>Identify yourself and the reason for the stop; show your badge.</li>
        <li>No masks/face coverings; check for a valid license (unexpired, clear face, no group photo).</li>
        <li>Document the ID with the person who presented it.</li>
        <li>Return to your vehicle, look up info, write any tickets.</li>
        <li>Explain next steps — citations can be appealed within <strong>14 days</strong>; unpaid fines auto-deduct as a No Contest plea.</li>
      </ul>
      <div class="callout warn">Only <strong>infractions</strong> get fines sent through the MDT. Never send misdemeanor or felony fines through the MDT.</div>
      <h3>Felony / Code 5 stop</h3>
      <ul>
        <li>Request backup with the reason for the Code 5.</li>
        <li>Arriving units position left and right of the initiating officer.</li>
        <li>Suspect told to turn off vehicle; on countdown, all officers exit with doors open for cover, weapons drawn (taser ready if assigned). Watch your line of fire.</li>
        <li>Occupants exit one at a time on the lead officer's clear instructions.</li>
        <li>Once detained, two officers clear doors and trunk.</li>
        <li>Proceed with the stop as normal.</li>
      </ul>
      <h3>Extra reminders</h3>
      <ul>
        <li>Stay respectful, explain the infraction.</li>
        <li>A valid, physical driver's license is required to drive in San Andreas.</li>
        <li>A visible plate is required — "no option for a plate" isn't a valid excuse.</li>
      </ul>
    `
  },
  crime:{
    title:"Criminal Activities & Response",
    eyebrow:"Call caps",
    teaser:"Officer/unit limits and the full responding-unit allowance table.",
    body:`
      <ul>
        <li><strong>10 officers max</strong> on any situation, with an exception for suspects swapping into 3+ cars at once (up to 2 cars per involved vehicle). Any call that turns into a shootout raises the cap to 10.</li>
        <li><strong>Vangelico's, Pacific Standard, Paleto Bank, Gruppe Sechs:</strong> hostage demands can never deny Air-1, MOTO, or HEAT — those demands are always voided.</li>
        <li><strong>Fleeca / Art Gallery:</strong> suspects can deny only one certification vehicle (e.g., no Air-1 <em>or</em> no MOTO, not both).</li>
      </ul>
      <h3>Counting officers & units</h3>
      <ul>
        <li>Every officer = 1. K9s and unarmed/civilian ride-alongs don't count toward the 10.</li>
        <li>A unit = a vehicle, max 3 officers each. A MOTO "tandem" (2 bikes) = 1 unit.</li>
        <li>Helicopters don't count as a unit, but the officers inside still count toward the officer cap.</li>
        <li>Staying within limits is everyone's job, but ultimately falls on the highest-ranking officer on the call.</li>
      </ul>
      <h3>Responding unit allowances (by call type)</h3>

        <tr><th>Crime</th><th>Units</th><th>Max Officers</th><th>Air-1</th><th>Moto</th><th>Interceptor</th></tr>

        <tr><td>Shootout w/ officers (OIS)</td><td>10</td><td>10</td><td>Yes</td><td>N/A</td><td>Yes*</td></tr>
        <tr><td>Gruppe Sechs (G6)</td><td>5</td><td>10†</td><td>Yes</td><td>Yes</td><td>Yes</td></tr>
        <tr><td>Pacific Standard / Paleto</td><td>5</td><td>10†</td><td>Yes</td><td>Yes</td><td>Yes</td></tr>
        <tr><td>Vangelico's</td><td>5</td><td>10†</td><td>Yes</td><td>Yes</td><td>Yes</td></tr>
        <tr><td>Bank Robbery / Art Gallery</td><td>4</td><td>10†</td><td>Yes</td><td>Yes</td><td>No (vehicle dep.)</td></tr>
        <tr><td>Bank Truck</td><td>6</td><td>10 (2 shields max)</td><td>Yes</td><td>Yes</td><td>No</td></tr>
        <tr><td>Store / Container Robbery</td><td>3</td><td>10†</td><td>No</td><td>No (vehicle dep.)</td><td>No</td></tr>
        <tr><td>Vehicle Boost: Class X</td><td>3</td><td>10†</td><td>Yes</td><td>Yes (max 2 MEAT, bikes)</td><td>Yes (max 2 HEAT)</td></tr>
        <tr><td>Vehicle Boost: Class S</td><td>3</td><td>10†</td><td>Yes</td><td>Yes (max 2 MEAT, bikes)</td><td>Yes (max 1 HEAT)</td></tr>
        <tr><td>Vehicle Boost: Class D/C/B/A</td><td>3</td><td>10†</td><td>No</td><td>No (unless bike)</td><td>No</td></tr>
        <tr><td>Prison Transport (10-86)</td><td>7</td><td>15 (incl. DOC w/ lethals)</td><td>Yes</td><td>No</td><td>No</td></tr>
        <tr><td>Any unlisted call</td><td>3</td><td>10†</td><td>N/A</td><td>N/A</td><td>N/A</td></tr>
      </table>
      <p style="font-size:12.5px;color:var(--paper-dim);">* if already in HEAT · † rises to 10 automatically if the call becomes a shootout</p>
    `

  cleanup:{
    title:"Cleanup Protocol",
    eyebrow:"Mass-casualty scenes",
    teaser:"The 60-second timer after all officers are down, then triage.",
    body:`
      <ul>
        <li>Triggered when all 10 officers on a scene are incapacitated. Cleanup can stage early on a separate call/radio, staying clear until needed.</li>
        <li>Once the last original officer goes down (13A), a <strong>60-second timer</strong> starts — ideally announced by an air unit's loudspeaker — telling suspects to grab their people and leave before cleanup moves in, and warning them not to rob officers.</li>
        <li>Anyone caught robbing officers during or after the timer gets fired upon by cleanup, regardless of the timer status.</li>
        <li>If suspects are still on scene after 60 seconds and not leaving/still robbing, a <strong>Sergeant</strong> can call Code Red (or the highest officer present if no sergeant is available).</li>
      </ul>
      <h3>Once the scene is Code 4</h3>
      <ul>
        <li>First priority: triage downed officers — stop bleeding, check breathing/heart rate, wait for EMS.</li>
        <li>Once stable, a small group detaches to collect evidence: shell casings, blood samples, document leftover vehicles.</li>
        <li>All evidence goes into an <strong>evidence report</strong> forwarded to CID ASAP.</li>
      </ul>
    `
  },
  gang:{
    title:"Gang Activity Response",
    eyebrow:"Gang fights & blocks",
    teaser:"Fight timers by location, robbing rule, gang block push cap.",
    body:`
      <h3>Gang fights</h3>
      <ul>
        <li><strong>Outside the Southside:</strong> stop it fast — once a perimeter is up, give both sides a <strong>2-minute</strong> warning (air unit loudspeaker preferred) before PD moves in. Still fighting after that → a supervisor can Code Red the shooter(s).</li>
        <li><strong>Inside the Southside:</strong> more leniency — a <strong>15-minute</strong> window from the first warning before units move in and Code Red shooters (once cleared by a supervisor).</li>
        <li>Both sides are told not to rob — looting after the warning gets suspects fired on regardless of the timer. A Sergeant can Code Red a specific suspect caught robbing a downed suspect, even their own gang member.</li>
        <li>Response cap: <strong>10 officers per gang involved</strong>, rising to 10 if officers join the shootout. If the chase splits, try to run it as two separate calls.</li>
        <li>Primary objective is rendering aid — stay on scene for downed suspects/evidence; chase evaders only if units can be spared.</li>
        <li><strong>All gang members are arrested</strong> from a gang fight, chased or not. Catch-and-release only applies if a detained member is both GSR-negative <em>and</em> has no illegal possessions — never released just for losing a fight (reductions can be offered instead if you feel for them).</li>
      </ul>
      <h3>Gang blocks</h3>
      <p>Gangs don't legally own their turf — you can tell them to leave — but expect it to aggravate them, so stay vigilant. Pushing a block with more than <strong>5 suspects</strong> allows up to <strong>20 officers</strong> on the call.</p>
    `
  },
  suspects:{
    title:"Suspect Interactions",
    eyebrow:"Stops, rights & arrests",
    teaser:"Reasonable suspicion, probable cause, full arrest checklist.",
    body:`
      <div class="two-col">
        <div>
          <h3>Reasonable Suspicion</h3>
          <p>Specific facts or circumstances — more than a hunch — that justify stopping and questioning someone, and a Terry frisk for weapons if justified. Feeling something that could be a weapon → probable cause for a search. Allows detain + question.</p>
        </div>
        <div>
          <h3>Probable Cause</h3>
          <p>Facts/circumstances that would lead a reasonable person to believe a crime was, is, or is about to be committed — e.g. contraband in plain view/smell, or an admission of guilt. Minor traffic violations alone are <strong>not</strong> probable cause to search. Required for search & seizure or arrest.</p>
        </div>
      </div>
      <h3>Detention vs. arrest</h3>
      <ul>
        <li><strong>Detention:</strong> temporarily not free to leave, clearly communicated — cuffs not required, but the person must follow lawful commands (e.g. a traffic stop).</li>
        <li><strong>Arrest:</strong> taken into custody, charges formally being placed.</li>
      </ul>
      <h3>A suspect's rights</h3>
      <ul>
        <li>Check for injury first and offer medical help — injuries in custody are a liability that falls on the officer.</li>
        <li>Read Miranda Rights once health is confirmed; the suspect must confirm they understand.</li>
        <li>Always offer an attorney and note their answer; make sure they don't need food/water.</li>
        <li>Right to speedy processing — get charges filed and a plea taken before writing reports.</li>
      </ul>
      <h3>Arrest checklist (suspect already cuffed)</h3>
      <ul>
        <li>Make sure they're not dying — patch bleeding, call EMS if needed.</li>
        <li>Search + photograph pockets/bags, weapon serials, ID cards.</li>
        <li>Hospital if needed → read Miranda rights → transport to station, offer a lawyer.</li>
        <li>Confirm fingerprints/MDT photo are current (update if not); DNA on file for violent felonies.</li>
        <li>Search again — no phones, radios, weapons, drugs, alcohol, spraycans, lockpicks, spy cameras, lighters, mics, jukeboxes, or other illegal items.</li>
        <li>Lock in holding cell, uncuff through the bars.</li>
        <li>Write the report with charges + photos; pull any felony weapon license if applicable.</li>
        <li>Negotiate with a lawyer if present/requested — no reductions for government-issued item/police weapon possession charges (Class 1–3), even with a lawyer.</li>
        <li>After plea: fine + send to jail (check DOC availability; remove masks/gang identifiers first).</li>
        <li>Evidence → evidence locker (non-returnable). Confiscated-but-returnable items → suspect's Confiscation locker (needs CID). Phone/radio/lighter can be returned before transport if going "locally."</li>
        <li>Write the full report, attach evidence and photos → back <strong>10-8</strong>.</li>
      </ul>
      <h3>Community service</h3>
      <ul>
        <li>Can replace sentencing hours for nonviolent felonies/misdemeanors, negotiated with a lawyer or set by the arresting officer/command.</li>
        <li>Tasks = months that would've been served × <strong>1.5</strong> or <strong>2</strong> (e.g. 10 months → 15 or 20 tasks).</li>
        <li>Approved locations: Legion Park, Las Lagunas Park, Recreation Center (Forum Dr), Courthouse (Rockford Hills), Sandy Shores Marina, Dignity Village (Paleto).</li>
        <li>Via the Police utility belt → Community Service → select location → set task count; return confiscated items and release once complete.</li>
      </ul>
      <h3>Reductions & time served</h3>
      <div class="callout">Use the <strong>Penal Code</strong> for sentencing reference. Always ask if a lawyer is wanted (check yellow pages / DOJ app / services app).</div>
      <ul>
        <li>Up to <strong>20%</strong> fine reduction: Supervisor+ (must have exhausted efforts to get a lawyer).</li>
        <li>Up to <strong>30%</strong>: Command+ (same requirement).</li>
        <li><strong>40% is the absolute max</strong>, even with a lawyer present — reductions are a privilege, not a right.</li>
        <li>Government-issued item / police weapon possession charges: never eligible for reduction.</li>
        <li><strong>Time served is mandatory</strong>, not a reduction — PD-caused delays get added to it; only the suspect's own fault (e.g. being unresponsive) is exempt.</li>
      </ul>
    `
  },
  warrants:{
    title:"Warrants & BOLOs",
    eyebrow:"Flags",
    teaser:"How to issue, approve, and serve a warrant or BOLO.",
    body:`
      <h3>Warrants</h3>
      <ul>
        <li>Used to arrest someone not currently present. Requires positive ID + probable cause.</li>
        <li>Write the report and attach charges as if arresting, but mark it as a warrant. Only for felony or capital charges.</li>
        <li>Approved by a Sergeant+ or a State's Attorney's Office member, who logs their name, callsign, and date/time.</li>
        <li>Be extra detailed — you likely won't be there for processing, and someone else needs to fully understand the charges.</li>
        <li>When served: the finding officer runs a normal arrest, plus an incident report for the scene they found them on (if needed), <em>and</em> serves the warrant charges separately. Pleading/negotiating is handled separately per report, but time/fine combine.</li>
        <li>After serving, mark the warrant "served" with your name, callsign, date/time.</li>
      </ul>
      <h3>BOLOs</h3>
      <ul>
        <li>"Be On the Look Out" — flags a vehicle; your radar auto-recognizes active BOLOs.</li>
        <li>Used for vehicles fleeing cops or otherwise sought for a crime.</li>
        <li>Report needs enough detail that someone with zero context on the original scene could still gather evidence.</li>
        <li>Anyone in SASP can issue one, no approval needed — but the issuer is responsible for keeping it current and disabling it when it's no longer needed.</li>
      </ul>
    `
  },
  discipline:{
    title:"Disciplinary Actions",
    eyebrow:"Accountability",
    teaser:"Strike escalation, expungement timeline, at-will status.",
    body:`
      <ul>
        <li>Grounds include unprofessional conduct, SOP violations, insubordination, or failing basic duties.</li>
        <li><strong>Corporal+</strong> can send someone off duty for 24 hours and issue verbal/written warnings.</li>
        <li><strong>Sergeant+</strong> can issue strikes and suspensions.</li>
      </ul>
      <h3>Strike escalation</h3>
      <ol style="padding-left:20px;">
        <li>No extra restrictions</li>
        <li>Can't earn new certifications, transfer departments, or be promoted</li>
        <li>All earned certifications held (including TAC-cert)</li>
        <li>Potential suspension and/or demotion</li>
        <li>Termination</li>
      </ol>
      <div class="callout">Strikes expunge <strong>30 days</strong> after issuance via a command member — but a new strike before expungement resets the 30-day timer and keeps everything active.</div>
      <ul>
        <li>LOA requests go through the form in LEO Documents (SASP emails).</li>
        <li>SASP is an <strong>at-will employer</strong> — termination can happen anytime, without cause, as long as it isn't sexually, racially, or religiously motivated.</li>
      </ul>
    `

      <h3>Miranda Rights</h3>
      <div class="callout">
        "You have the right to remain silent. Anything you say or do can and will be used against you in the court of law. You have the right to an attorney. If you cannot afford one, one will be appointed to you by the state if there is one available. Do you understand these rights as I have read them to you?"
        <br><br><strong>Requires a verbal confirmation from the suspect.</strong>
      </div>
    `

  caselaw:{
    title:"Case Law",
    eyebrow:"Legal reference",
    teaser:"The key precedents behind stops, searches, and Miranda.",
    body:`
      <div class="caselaw-card">
        <h4>Tennessee v. Garner, 471 U.S. 1 (1985)</h4>
        <p>Deadly force to stop a fleeing felon is only justified if necessary to prevent the escape and the officer has probable cause to believe the suspect poses a significant threat of death or serious physical injury to the officer or others.</p>
      </div>
      <div class="caselaw-card">
        <h4>Terry v. Ohio, 392 U.S. 1 (1968)</h4>
        <p>An officer can briefly detain someone based on reasonable suspicion of criminal activity, long enough to dispel the suspicion or let it rise to probable cause for arrest, and may do a limited "frisk" for weapons without a warrant. To frisk, the officer must have articulable facts the person could be armed, limit the search to patting outer garments for weapon-like objects, and only reach inside clothing after feeling such an object.</p>
      </div>
      <div class="caselaw-card">
        <h4>Wyoming v. Houghton, 526 U.S. 295 (1999)</h4>
        <p>Absent exigency, a warrantless search of a passenger's container capable of holding the object of a search doesn't violate the Fourth Amendment when justified under the automobile exception.</p>
      </div>
      <div class="caselaw-card">
        <h4>Miranda v. Arizona, 384 U.S. 436 (1966)</h4>
        <p>A statement made during custodial interrogation is presumed involuntary without Miranda warnings. "Custody" means an arrest or equivalent deprivation of freedom; "interrogation" means words or actions meant to elicit an incriminating response.</p>
      </div>
      <div class="caselaw-card">
        <h4>Carroll v. U.S., 267 U.S. 132 (1925)</h4>
        <p>Police may conduct a warrantless search of a vehicle stopped in traffic if there's probable cause to believe it contains contraband or evidence.</p>
      </div>
      <div class="caselaw-card">
        <h4>Pennsylvania v. Mimms, 434 U.S. 106 (1977)</h4>
        <p>Ordering a person out of a car following a traffic stop does not violate the Fourth Amendment. A pat-down still requires reasonable suspicion the person is armed and dangerous (per Terry v. Ohio).</p>
      </div>
      <div class="caselaw-card">
        <h4>Maryland v. King, 569 U.S. 435 (2013)</h4>
        <p>A cheek swab of an arrestee's DNA is comparable to fingerprinting — a reasonable, legal booking procedure under the Fourth Amendment, but only when charging the arrestee with a <span style="color:var(--red);">violent</span> crime.</p>
      </div>
      <div class="caselaw-card">
        <h4>De-Luca v. State of San Andreas (2023)</h4>
        <p>San Andreas has no express "delayed death" exception, but the court recognizes its necessity. Because Los Santos arraignments often happen minutes after arrest, followed immediately by pleas, the court acknowledges a "delayed death" exception to double jeopardy to safeguard due process.</p>
      </div>
      <div class="caselaw-card">
        <h4>Brady v. Maryland (1963)</h4>
        <p>Withholding evidence material to guilt or punishment violates a defendant's constitutional right to due process.</p>
        <p style="margin-top:8px;"><a href="https://drive.google.com/file/d/1yVAa9JDWNShDNCOg_WH1ZH2ioslaTpPq/view" target="_blank" rel="noopener">More info →</a></p>
      </div>
    `

  const h = document.createElement('div');
  h.className = 'group-title';
  h.textContent = group.title;
  main.appendChild(h);

  const grid = document.createElement('div');
  grid.className = 'grid';
  group.items.forEach((id) => {
    const s = sections[id];
    const btn = document.createElement('button');
    btn.className = 'card-btn';
    btn.innerHTML = `
      <div class="card-top">
        <span class="card-num">${id.toUpperCase()}</span>
        <span class="card-tag">${s.eyebrow}</span>
      </div>
      <h3>${s.title}</h3>
      <div class="teaser">${s.teaser}</div>
    `;
    btn.addEventListener('click', () => openModal(id));
    grid.appendChild(btn);
  });
  main.appendChild(grid);
});

const overlay = document.getElementById('overlay');
const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modalTitle');
const modalEyebrow = document.getElementById('modalEyebrow');
const modalBody = document.getElementById('modalBody');
const modalClose = document.getElementById('modalClose');

function openModal(id){
  const s = sections[id];
  modalEyebrow.textContent = s.eyebrow;
  modalTitle.textContent = s.title;
  modal.classList.toggle('wide', !!s.isPenalCode);
  if(s.isQuiz){
    startQuiz(id);
  } else if(s.isPenalCode){
    renderPenalCode();
  } else {
    modalBody.innerHTML = s.body;
  }
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  modalClose.focus();
}
function closeModal(){
  overlay.classList.remove('open');
  document.body.style.overflow = '';
}
modalClose.addEventListener('click', closeModal);
overlay.addEventListener('click', e => { if(e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

let quizState = {quizId:null, questions:[], index:0, score:0, answered:false};
const QUIZ_SESSION_SIZE = 10;

function shuffleArray(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildQuizSession(quizId){
  const pool = quizzes[quizId];
  const sessionSize = Math.min(QUIZ_SESSION_SIZE, pool.length);
  const picked = shuffleArray(pool).slice(0, sessionSize);
  return picked.map(q => Object.assign({}, q, { options: shuffleArray(q.options) }));
}

function startQuiz(quizId){
  quizState = { quizId, questions: buildQuizSession(quizId), index:0, score:0, answered:false };
  renderQuizQuestion();
}

function quizScoreMessage(score, total, quizId){
  const pct = score / total;
  const topic = quizId === 'quizUnits' ? "Criminal Activities & Response" : "10-Codes and Case Law";
  if(pct === 1) return "Perfect score — you know this cold.";
  if(pct >= 0.75) return "Solid work — a couple worth a second look.";
  if(pct >= 0.5) return `Halfway there — review ${topic}.`;
  return `Worth a re-read of ${topic} before your next shift.`;
}

function renderQuizQuestion(){
  const questions = quizState.questions;
  const total = questions.length;
  if(quizState.index >= total){
    modalBody.innerHTML = `
      <div class="quiz-score">
        <div class="big">${quizState.score} / ${total}</div>
        <p style="color:var(--paper-dim);">${quizScoreMessage(quizState.score, total, quizState.quizId)}</p>
        <button class="quiz-btn" id="quizRetry">🔀 New Questions</button>
      </div>
    `;
    document.getElementById('quizRetry').addEventListener('click', () => {
      startQuiz(quizState.quizId);
    });
    return;
  }

  const q = questions[quizState.index];
  modalBody.innerHTML = `
    <div class="quiz-progress-row">
      <div class="quiz-progress">Question ${quizState.index + 1} of ${total} · Score: ${quizState.score}</div>
      <button class="quiz-shuffle-btn" id="quizShuffleBtn" title="Get a new random set of questions">🔀 New Questions</button>
    </div>
    <div class="quiz-prompt">${q.prompt}</div>
    ${q.hint ? `<button class="quiz-hint-btn" id="quizHintBtn">Show hint</button><div class="quiz-hint-text" id="quizHintText" style="display:none;">${q.hint}</div>` : ''}
    <div id="quizOptions"></div>
  `;

  document.getElementById('quizShuffleBtn').addEventListener('click', () => {
    startQuiz(quizState.quizId);
  });

  const optionsEl = document.getElementById('quizOptions');
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'quiz-option';
    btn.textContent = opt.text;
    btn.addEventListener('click', () => selectQuizOption(opt.id));
    optionsEl.appendChild(btn);
  });

  if(q.hint){
    document.getElementById('quizHintBtn').addEventListener('click', () => {
      const t = document.getElementById('quizHintText');
      t.style.display = t.style.display === 'none' ? 'block' : 'none';
    });
  }
}

function selectQuizOption(optId){
  if(quizState.answered) return;
  quizState.answered = true;
  const q = quizState.questions[quizState.index];
  const correct = optId === q.correct;
  if(correct) quizState.score++;

  const allBtns = Array.from(document.querySelectorAll('.quiz-option'));
  allBtns.forEach(b => b.classList.add('disabled'));
  const chosenIdx = q.options.findIndex(o => o.id === optId);
  allBtns[chosenIdx].classList.add(correct ? 'correct' : 'incorrect');
  if(!correct){
    const correctIdx = q.options.findIndex(o => o.id === q.correct);
    allBtns[correctIdx].classList.add('correct');
  }

  const feedback = document.createElement('div');
  feedback.className = 'quiz-feedback' + (correct ? '' : ' wrong');
  feedback.innerHTML = `<strong>${correct ? (q.correctFeedback || 'Correct.') : (q.incorrectFeedback || 'Not quite.')}</strong> ${q.explanation}`;
  document.getElementById('quizOptions').after(feedback);

  const isLast = quizState.index === quizState.questions.length - 1;
  const nav = document.createElement('div');
  nav.className = 'quiz-nav';
  const nextBtn = document.createElement('button');
  nextBtn.className = 'quiz-btn';
  nextBtn.textContent = isLast ? 'See results' : 'Next question';
  nextBtn.addEventListener('click', () => {
    quizState.index++;
    quizState.answered = false;
    renderQuizQuestion();
  });
  nav.appendChild(nextBtn);
  feedback.after(nav);
}

function pcClassSlug(c){
  if(c.indexOf("Capital") === 0) return "capital";
  if(c.indexOf("Felony") === 0) return "felony";
  if(c.indexOf("Misdemeanor") === 0) return "misdemeanor";
  return "infraction";
}

        {label:"Standard", cls:"Misdemeanor", months:"15 mo", fine:"$1,500"},
        {label:"Government Employee", cls:"Felony", months:"20 mo", fine:"$2,000"},
        {label:"Judiciary Member", cls:"Felony", months:"30 mo", fine:"$3,000"}
      ]},
      {pc:"1010", name:"Aggravated Assault", desc:"Intentionally threatening or attempting serious bodily harm via a deadly weapon or dangerous conduct, even without contact.", tiers:[
        {label:"Standard", cls:"Felony", months:"25 mo", fine:"$3,000"},
        {label:"Government Employee", cls:"Felony", months:"30 mo", fine:"$4,000"},
        {label:"Judiciary Member", cls:"Felony", months:"40 mo", fine:"$6,000"}
      ]},
      {pc:"1011", name:"Aggravated Battery", desc:"Unlawful, intentional force causing or attempting serious bodily injury via a deadly weapon or dangerous instrument.", tiers:[
        {label:"Standard", cls:"Felony", months:"30 mo", fine:"$5,000"},
        {label:"Government Employee", cls:"Felony", months:"40 mo", fine:"$7,000"},
        {label:"Judiciary Member", cls:"Felony", months:"50 mo", fine:"$9,000"}
      ]},
      {pc:"1012", name:"Attempted Murder", desc:"A willful, premeditated attempt to unlawfully kill someone that fails, is prevented, or is intercepted.", tiers:[
        {label:"Standard", cls:"Felony", months:"50 mo", fine:"$7,500"},
        {label:"Government Employee", cls:"Felony", months:"55 mo", fine:"$9,500"},
        {label:"Judiciary Member", cls:"Felony", months:"75 mo", fine:"$15,000"}
      ]},
      {pc:"1013", name:"Attempted Mass Murder", desc:"A willful attempt to kill 5 or more people in a single incident or coordinated attack. Excludes gang-related violence.", tiers:[
        {label:"Standard", cls:"Felony", months:"60 mo", fine:"$10,000"},
        {label:"Government Employees", cls:"Felony", months:"65 mo", fine:"$12,000"}

      {pc:"1014", name:"Torture", desc:"Deliberately inflicting severe physical or mental pain, injury, or suffering.", tiers:[{label:"", cls:"Capital Offense", months:"HUT", fine:"—"}]},
      {pc:"1015", name:"Manslaughter", desc:"Involuntary: unintentionally killing via a reckless/negligent act or a non-felony crime. Voluntary: intentionally killing without premeditation, amid a reckless act or traumatic confrontation.", tiers:[
        {label:"Involuntary", cls:"Felony", months:"1 yr", fine:"$50,000"},
        {label:"Voluntary", cls:"Felony", months:"HUT", fine:"—"}

      {pc:"1016", name:"Vehicular Manslaughter", desc:"Unintentionally killing someone through the reckless or negligent use of a vehicle.", tiers:[{label:"", cls:"Felony", months:"3 yrs", fine:"$75,000"}]},
      {pc:"1017", name:"Second Degree Murder", desc:"Unlawfully and deliberately killing someone with malice aforethought, but without premeditation. Accessories after the fact carry the same classification.", tiers:[
        {label:"Standard / Accessory", cls:"Capital Offense", months:"HUT", fine:"—"},
        {label:"Government Employee / Accessory", cls:"Capital Offense", months:"HUT", fine:"—"},
        {label:"Judiciary Member / Accessory", cls:"Capital Offense", months:"HUT", fine:"—"}
      ]},
      {pc:"1018", name:"First Degree Murder", desc:"Premeditated killing, or killing during arson, kidnapping, robbery, human trafficking, carjacking, CDS manufacturing, or another serious crime. Accessories after the fact carry the same classification.", tiers:[
        {label:"Standard / Accessory", cls:"Capital Offense", months:"HUT", fine:"—"},
        {label:"Government Employee / Accessory", cls:"Capital Offense", months:"HUT", fine:"—"},
        {label:"Judiciary Member / Accessory", cls:"Capital Offense", months:"HUT", fine:"—"}
      ]},
      {pc:"1019", name:"Cannibalism", desc:"Intentionally ingesting human flesh, blood, or organs. Only defensible under extreme, life-threatening survival conditions.", tiers:[{label:"Standard / Accessory", cls:"Capital Offense", months:"HUT", fine:"—"}]},
      {pc:"1020", name:"Gang Related Violence", desc:"Participating in violent acts furthering gang activity — drive-bys, attacks on rivals, retaliatory shootings, or intimidation of other groups.", tiers:[{label:"", cls:"Felony", months:"30 mo", fine:"$5,000"}]}
    ]},

    { title:"Title 2 — Offenses Involving Theft", items:[

      {pc:"2002", name:"Grand Theft", desc:"Stealing property worth $5,000 or more from a person or business.", tiers:[{label:"", cls:"Felony", months:"25 mo", fine:"$2,000"}]},
      {pc:"2003", name:"Grand Theft Auto (A)", desc:"Unlawfully taking or driving another's vehicle without consent, temporarily or permanently depriving the owner of it.", tiers:[{label:"", cls:"Felony", months:"20 mo", fine:"$2,000"}]},
      {pc:"2004", name:"Grand Theft Auto (B)", desc:"Unlawfully taking a government-issued vehicle (law enforcement, EMS, military) without authorization.", tiers:[{label:"", cls:"Felony", months:"35 mo", fine:"$3,500"}]},
      {pc:"2005", name:"Carjacking", desc:"Taking a vehicle by force, intimidation, or threat of harm, including forcing occupants out against their will.", tiers:[{label:"", cls:"Felony", months:"30 mo", fine:"$2,000"}]},
      {pc:"2006", name:"Burglary", desc:"Unlawfully entering, breaking into, or hiding in a building, vehicle, or habitation intending to commit theft or another crime inside.", tiers:[{label:"", cls:"Misdemeanor", months:"10 mo", fine:"$1,250"}]},
      {pc:"2007", name:"Robbery", desc:"Unlawfully taking property or goods from the listed locations; degree depends on which location was hit.", tiers:[
        {label:"3rd Degree — gas stations, ATMs, IAA, dwellings/vehicles", cls:"Felony", months:"20 mo", fine:"$2,000"},
        {label:"2nd Degree — CoC businesses, containers, art institution, Fleeca, Vangelico's", cls:"Felony", months:"25 mo", fine:"$3,500"},
        {label:"1st Degree — Gruppe Sechs, Blaine County Savings, Pacific Standard", cls:"Felony", months:"35 mo", fine:"$5,000"}
      ]},
      {pc:"2008", name:"Aggravated Robbery", desc:"Same locations as Robbery, but while possessing or threatening use of a firearm/weapon that endangers life.", tiers:[
        {label:"3rd Degree", cls:"Felony", months:"30 mo", fine:"$3,500"},
        {label:"2nd Degree", cls:"Felony", months:"35 mo", fine:"$5,000"},
        {label:"1st Degree", cls:"Felony", months:"45 mo", fine:"$7,500"}
      ]},
      {pc:"2009", name:"Leaving Without Paying", desc:"Obtaining services by deception, force, or threat without compensating the provider.", tiers:[{label:"", cls:"Misdemeanor", months:"10 mo", fine:"$1,000"}]},
      {pc:"2010", name:"Possession of Nonlegal or Stolen Currency", desc:"Possessing money known to be stolen from a financial institution, armored vehicle, or secured location.", tiers:[{label:"", cls:"Misdemeanor", months:"10 mo", fine:"$1,000"}]},
      {pc:"2011", name:"Possession of Government-Issued Items", desc:"Possessing non-weapon items issued exclusively to SASP/state employees — GPS trackers, IFAKs, ballistic shields, spike strips, etc. Doesn't cover police firearms.", tiers:[{label:"", cls:"Felony", months:"25 mo", fine:"$5,000"}]},
      {pc:"2012", name:"Possession of Items Used in a Crime", desc:"Possessing items that aided a Title 2 offense (cards, laptops, blowtorches, lockpicks) or operating a still. Doesn't cover weapons.", tiers:[{label:"", cls:"Misdemeanor", months:"10 mo", fine:"$500"}]},
      {pc:"2013", name:"Sale of Items Used in a Crime", desc:"Unlawfully selling items that could aid a crime (SD cards, laptops, blowtorches, lockpicks) to an unauthorized person or business.", tiers:[{label:"", cls:"Felony", months:"15 mo", fine:"$1,000"}]}
    ]},

    { title:"Title 3 — Offenses Involving Fraud", items:[
      {pc:"3001", name:"Impersonation", desc:"Falsely representing yourself as another person, a government employee, a peace officer/public servant, or a judiciary member to defraud, deceive, or gain access/authority.", tiers:[
        {label:"Standard", cls:"Misdemeanor", months:"15 mo", fine:"$1,250"},
        {label:"Government Employee", cls:"Felony", months:"20 mo", fine:"$2,500"},
        {label:"Peace Officer / Public Servant", cls:"Felony", months:"25 mo", fine:"$5,000"},
        {label:"Judiciary Member", cls:"Felony", months:"40 mo", fine:"$10,000"}
      ]},
      {pc:"3002", name:"Possession of Stolen Identification", desc:"Unlawfully possessing or fraudulently using someone else's ID, or a government employee's badge/ID.", tiers:[
        {label:"Standard", cls:"Misdemeanor", months:"10 mo", fine:"$1,000"},
        {label:"Government ID", cls:"Misdemeanor", months:"20 mo", fine:"$2,500"}
      ]},
      {pc:"3003", name:"Extortion", desc:"Coercing, threatening, or pressuring someone for money/property/services/advantage against their will. Covers blackmail, protection schemes, and hostile buyouts.", tiers:[
        {label:"Standard", cls:"Felony", months:"20 mo", fine:"$2,000"},
        {label:"Aggravated (with violence)", cls:"Felony", months:"35 mo", fine:"$3,500"},
        {label:"Corporate (\"Greenmail\")", cls:"Felony", months:"25 mo", fine:"$2,500"}
      ]},
      {pc:"3004", name:"Fraud", desc:"Knowingly defrauding someone via false or fraudulent pretense for money, labor, or property.", tiers:[
        {label:"Standard", cls:"Misdemeanor", months:"10 mo", fine:"$2,500"},
        {label:"Grand (over $100k or multiple victims)", cls:"Felony", months:"25 mo", fine:"$7,500"}
      ]},
      {pc:"3005", name:"Forgery", desc:"Possessing or creating knowingly false financial records, contracts, IDs, or government documents.", tiers:[{label:"", cls:"Misdemeanor", months:"15 mo", fine:"$1,500"}]},
      {pc:"3006", name:"Money Laundering", desc:"Making money from criminal activity appear to come from a legitimate source.", tiers:[
        {label:"3rd Degree — ≤ $10,000", cls:"Felony", months:"20 mo", fine:"$2,500"},
        {label:"2nd Degree — $10,001–$50,000", cls:"Felony", months:"50 mo", fine:"$5,000"},
        {label:"1st Degree — $50,001+", cls:"Felony", months:"75 mo", fine:"$10,000"}
      ]},
      {pc:"3007", name:"Unauthorized Commercial Sales", desc:"Selling/distributing legal goods through unauthorized or unlicensed channels, evading taxes/licensing. Doesn't cover private individual sales.", tiers:[{label:"", cls:"Felony", months:"25 mo", fine:"$5,000"}]},
      {pc:"3008", name:"Trafficking in Illegal Goods or Counterfeit Currency", desc:"Trading, selling, or distributing illegal goods, stolen property, counterfeit items, or unregistered firearms through unregulated markets for profit.", tiers:[{label:"", cls:"Felony", months:"50 mo", fine:"$10,000"}]},
      {pc:"3009", name:"Tax Evasion", desc:"Evading a state-imposed tax.", tiers:[
        {label:"Misdemeanor — up to $20,000", cls:"Misdemeanor", months:"SACOR discretion", fine:"up to 30% asset forfeiture"},
        {label:"Felony — over $20,000", cls:"Felony", months:"SACOR discretion", fine:"full asset freeze/forfeiture + audit"}
      ]}
    ]},

    { title:"Title 4 — Offenses Involving Damage to Property", items:[
      {pc:"4001", name:"Trespassing", desc:"Willfully entering or remaining on private, restricted, or government property without permission or after being told to leave.", tiers:[
        {label:"Standard", cls:"Misdemeanor", months:"10 mo", fine:"$1,000"},
        {label:"Aggravated (with a weapon)", cls:"Felony", months:"20 mo", fine:"$2,000"},
        {label:"Felony (government property)", cls:"Felony", months:"25 mo", fine:"$3,000"}
      ]},
      {pc:"4002", name:"Obstructing a Business Establishment", desc:"Interfering with a lawful business by obstructing/intimidating it or its customers, or refusing to leave when asked.", tiers:[{label:"", cls:"Misdemeanor", months:"15 mo", fine:"$1,500"}]},
      {pc:"4003", name:"Burning", desc:"Recklessly causing a fire without intent to damage (Reckless Burning), or willfully/maliciously starting one to damage property or burn a person/animal/structure (Arson).", tiers:[
        {label:"Reckless Burning", cls:"Misdemeanor", months:"15 mo", fine:"$1,500"},
        {label:"Arson", cls:"Felony", months:"25 mo", fine:"$4,500"}
      ]},
      {pc:"4004", name:"Vandalism", desc:"Intentionally defacing, destroying, or damaging property that isn't yours.", tiers:[
        {label:"Standard", cls:"Misdemeanor", months:"5 mo", fine:"$1,000"},
        {label:"Burial Site", cls:"Misdemeanor", months:"10 mo", fine:"$2,000"},
        {label:"Government Property", cls:"Felony", months:"25 mo", fine:"$3,500"}
      ]},
      {pc:"4005", name:"Littering", desc:"Knowingly discarding waste, garbage, or hazardous materials in a public or private area without proper disposal.", tiers:[{label:"", cls:"Infraction", months:"0", fine:"$500"}]},
      {pc:"4006", name:"Damaging or Obstructing a Communication Device", desc:"Maliciously removing, damaging, or obstructing a wireless device to prevent someone from summoning help or reporting a crime.", tiers:[{label:"", cls:"Misdemeanor", months:"5 mo", fine:"$1,250"}]},
      {pc:"4007", name:"Destruction of Phone, Electrical, or Utility Lines", desc:"Maliciously disconnecting, cutting, or damaging phone, cable, or electrical lines.", tiers:[{label:"", cls:"Misdemeanor", months:"15 mo", fine:"$2,500"}]},
      {pc:"4008", name:"Misappropriation of Lost Property", desc:"Finding lost property with a way to identify the owner, and keeping it without reasonable effort to return it.", tiers:[
        {label:"Under $1,000", cls:"Misdemeanor", months:"10 mo", fine:"$1,000"},
        {label:"$1,000 or more", cls:"Felony", months:"20 mo", fine:"$2,000"}
      ]}
    ]},

    { title:"Title 5 — Offenses Against Public Administration", items:[
      {pc:"5001", name:"Bribery of a Government Official", desc:"Offering a benefit to a public servant to influence their official vote, judgment, or action.", tiers:[{label:"", cls:"Felony", months:"20 mo", fine:"$3,500"}]},
      {pc:"5002", name:"Unauthorized Face Covering", desc:"Wearing a face covering that obstructs ID in a government building/institution, or refusing to remove it during a lawful investigation.", tiers:[{label:"", cls:"Infraction", months:"0", fine:"$1,250"}]},
      {pc:"5003", name:"Possession of Contraband in a Government Facility", desc:"Possessing a weapon, controlled substance, explosives, or crime-related items in a government facility (excluding Bolingbroke).", tiers:[{label:"", cls:"Felony", months:"15 mo", fine:"$1,500"}]},
      {pc:"5004", name:"Smuggling Items into a Government Facility", desc:"Smuggling unauthorized items into a government facility (excluding Bolingbroke), including to another confined person.", tiers:[{label:"", cls:"Felony", months:"25 mo", fine:"$3,000"}]},
      {pc:"5005", name:"Criminal Possession of Stolen Property", desc:"Possessing property reported stolen or reasonably believed to be stolen.", tiers:[{label:"", cls:"Misdemeanor", months:"10 mo", fine:"$750"}]},
      {pc:"5006", name:"Escaping Custody", desc:"Escaping or attempting to escape the custody of law enforcement, a judge, or a government agency.", tiers:[{label:"", cls:"Felony", months:"15 mo", fine:"$1,000"}]},
      {pc:"5007", name:"Jailbreak", desc:"Removing yourself or someone else from official detention without authority, or failing to return from temporary leave; also applies if complicit in your own removal.", tiers:[{label:"", cls:"Felony", months:"60 mo", fine:"$6,000"}]},
      {pc:"5008", name:"Perjury / Subornation of Perjury", desc:"Knowingly lying under oath about a material fact (Perjury), or persuading someone else to do so (Subornation).", tiers:[{label:"Both", cls:"Felony", months:"Judge discretion", fine:"—"}]},
      {pc:"5009", name:"Filing a False Report by a Law Enforcement Officer", desc:"An officer knowingly making a false statement in an official report; severity depends on whether it substantially affects the case.", tiers:[
        {label:"Misdemeanor — minor fact", cls:"Misdemeanor", months:"20 mo", fine:"$5,000"},
        {label:"Felony — material fact", cls:"Felony", months:"60 mo", fine:"$15,000"}
      ]},
      {pc:"5010", name:"Violation of a Restraining Order", desc:"Willfully disobeying a lawful restraining order. Repeat violations on the same order escalate.", tiers:[
        {label:"1st & 2nd offense", cls:"Felony", months:"20 mo", fine:"$2,500"},
        {label:"3rd offense or higher", cls:"Felony", months:"HUT", fine:"—"}
      ]},
      {pc:"5011", name:"Embezzlement", desc:"Fraudulently appropriating business or government-granted funds entrusted to you for personal or criminal use.", tiers:[{label:"", cls:"Felony", months:"45 mo", fine:"$10,000"}]},
      {pc:"5012", name:"Unlawful Practice", desc:"Practicing law or medicine without required qualifications, licenses, or certifications.", tiers:[{label:"", cls:"Felony", months:"20 mo", fine:"$5,000"}]},
      {pc:"5013", name:"Misuse of Emergency Systems", desc:"Requesting emergency response with no good-faith basis, or falsely reporting a crime.", tiers:[{label:"", cls:"Misdemeanor", months:"10 mo", fine:"$1,000"}]},
      {pc:"5014", name:"Conspiracy", desc:"Conspiring with others to commit a crime, where at least one person commits an overt act toward it.", tiers:[
        {label:"Misdemeanor conspiracy", cls:"Misdemeanor", months:"10 mo", fine:"$1,000"},
        {label:"Felony conspiracy", cls:"Felony", months:"20 mo", fine:"$2,500"}
      ]},
      {pc:"5015", name:"Violating a Court Order", desc:"Willfully disobeying a court order — subpoena, search/seizure, settlement, NDA, plea deal, cease and desist.", tiers:[
        {label:"Misdemeanor", cls:"Misdemeanor", months:"Judge discretion", fine:"—"},
        {label:"Felony (aggravated/threatening)", cls:"Felony", months:"Judge discretion", fine:"—"}
      ]},
      {pc:"5016", name:"Failure to Appear", desc:"Willfully failing to appear in court after being properly notified, without a valid excuse.", tiers:[{label:"", cls:"Misdemeanor", months:"Judge discretion", fine:"—"}]},
      {pc:"5017", name:"Contempt of Court", desc:"Disorderly conduct in court, publishing a false report of proceedings, or refusing to be sworn in/answer as a witness.", tiers:[
        {label:"Misdemeanor", cls:"Misdemeanor", months:"Judge discretion", fine:"—"},
        {label:"Felony (aggravated/repeat)", cls:"Felony", months:"Judge discretion", fine:"—"}
      ]},
      {pc:"5018", name:"Resisting Arrest", desc:"Using force or fleeing to prevent arrest, cuffing, or being taken into custody.", tiers:[{label:"", cls:"Misdemeanor", months:"5 mo", fine:"$750"}]},
      {pc:"5019", name:"Malfeasance", desc:"A government employee acting with no legal authority, through ignorance, inattention, or malice — charged only by the State Attorney's Office.", tiers:[{label:"", cls:"Felony", months:"45 mo", fine:"$10,000"}]},
      {pc:"5020", name:"Operating Without a Permit", desc:"Operating an event without prior approval or license from an authorized government entity.", tiers:[{label:"", cls:"Infraction", months:"0", fine:"$2,500"}]},
      {pc:"5021", name:"Operating an Unlicensed Business", desc:"Operating a business without proper approval/licensure — requires State Attorney's Office approval to charge.", tiers:[{label:"", cls:"Felony", months:"30 mo", fine:"$10,000"}]}
    ]},

    { title:"Title 6 — Offenses Against Public Order", items:[
      {pc:"6001", name:"Disobeying a Peace Officer", desc:"Willfully refusing to comply with a lawful order, signal, or direction from law enforcement.", tiers:[{label:"", cls:"Infraction", months:"0", fine:"$750"}]},
      {pc:"6002", name:"Disorderly Conduct", desc:"Engaging in behavior intending to cause public inconvenience.", tiers:[{label:"", cls:"Infraction", months:"0", fine:"$1,000"}]},
      {pc:"6003", name:"Disturbing the Peace", desc:"Fighting or challenging someone to fight in public, unreasonable loud noise, or offensive words likely to provoke violence.", tiers:[{label:"", cls:"Infraction", months:"0", fine:"$1,500"}]},
      {pc:"6004", name:"Harassment", desc:"Aggressively intimidating or pressuring someone with unwelcome words, deeds, or gestures. +$500 per continued occurrence.", tiers:[{label:"", cls:"Misdemeanor", months:"10 mo", fine:"$1,000"}]},
      {pc:"6005", name:"Obstruction of Justice", desc:"Hindering the discovery, apprehension, conviction, or punishment of someone who committed a crime.", tiers:[
        {label:"Misdemeanor — reckless/negligent", cls:"Misdemeanor", months:"15 mo", fine:"$2,000"},
        {label:"Felony — intentional", cls:"Felony", months:"35 mo", fine:"$5,000"}
      ]},
      {pc:"6006", name:"Inciting a Riot", desc:"Organizing an assembly of 4+ people that results in violent conduct or risks public harm.", tiers:[{label:"", cls:"Felony", months:"25 mo", fine:"$3,000"}]},
      {pc:"6007", name:"Loitering on Government Properties", desc:"Idly standing or waiting without purpose at a listed government property (PDs, hospitals, Bolingbroke, courthouse).", tiers:[{label:"", cls:"Infraction", months:"0", fine:"$2,500"}]},
      {pc:"6008", name:"Tampering", desc:"Unauthorized access to devices/accounts (hacking), tampering with a vehicle, destroying/concealing evidence, or using force/threats against a witness.", tiers:[
        {label:"Standard / electronic", cls:"Misdemeanor", months:"10 mo", fine:"$1,000"},
        {label:"Vehicle", cls:"Misdemeanor", months:"15 mo", fine:"$2,500"},
        {label:"Evidence", cls:"Felony", months:"30 mo", fine:"$5,000"},
        {label:"Witness", cls:"Felony", months:"HUT", fine:"—"}
      ]},
      {pc:"6009", name:"Falsifying Business Records", desc:"Knowingly falsifying, altering, or fabricating business records to deceive or defraud.", tiers:[{label:"", cls:"Felony", months:"25 mo", fine:"$2,500"}]},
      {pc:"6010", name:"Failure to Provide Identification", desc:"Refusing to provide government ID to law enforcement when there's reason to request it.", tiers:[{label:"", cls:"Misdemeanor", months:"15 mo", fine:"$1,500"}]},
      {pc:"6011", name:"Vigilantism", desc:"Taking the law into your own hands — punishing, detaining, or acting against someone without legal authority.", tiers:[{label:"", cls:"Felony", months:"30 mo", fine:"$3,500"}]},
      {pc:"6012", name:"Unlawful Assembly", desc:"Participating in a 3+ person public assembly intending an illegal act, disruption, or violence.", tiers:[{label:"", cls:"Misdemeanor", months:"10 mo", fine:"$1,000"}]},
      {pc:"6013", name:"Government Corruption", desc:"A government employee acting outside the public interest with criminal negligence for personal gain — requires SAO approval.", tiers:[{label:"", cls:"Capital Offense", months:"HUT", fine:"—"}]},
      {pc:"6014", name:"Stalking", desc:"Repeatedly, willfully following or harassing someone, causing fear or emotional distress.", tiers:[{label:"", cls:"Felony", months:"40 mo", fine:"$7,500"}]},
      {pc:"6015", name:"Harboring a Fugitive", desc:"Knowingly concealing, sheltering, or assisting a wanted individual to help them evade law enforcement.", tiers:[{label:"", cls:"Misdemeanor", months:"10 mo", fine:"$2,500"}]}
    ]},

    { title:"Title 7 — Offenses Against Health and Morals", items:[
      {pc:"7001", name:"Possession of Controlled/Dangerous Substance", desc:"Possessing a CDS without valid prescription; degree depends on quantity (1 blunt/joint/bag = 1 marijuana unit).", tiers:[
        {label:"3rd Degree — 1–4 CDS / 31–42 marijuana", cls:"Misdemeanor", months:"10 mo", fine:"$1,000"},
        {label:"2nd Degree — 5–10 CDS / 43–80 marijuana", cls:"Felony", months:"25 mo", fine:"$2,500"},
        {label:"1st Degree — 11+ CDS / 81+ marijuana", cls:"Felony", months:"35 mo", fine:"$5,000"}

      {pc:"7003", name:"Sale of CDS", desc:"Unlawfully selling any controlled/dangerous substance or untaxed alcohol.", tiers:[{label:"", cls:"Felony", months:"35 mo", fine:"$4,500"}]},
      {pc:"7004", name:"Drug Trafficking", desc:"Manufacturing, selling, delivering, or possessing with intent to distribute CDS/marijuana/untaxed alcohol above trafficking thresholds; also covers illegal prescription drug sales.", tiers:[
