<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SASP SOP — Field Reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080b12;
    --bg-grid: rgba(120,170,220,0.05);
    --panel:#0f151f;
    --panel-2:#141c29;
    --panel-3:#19222f;
    --ink:#dde6f2;
    --ink-dim:#7c8aa0;
    --ink-faint:#4c5568;
    --line: rgba(140,175,215,0.14);
    --line-bright: rgba(140,175,215,0.3);

    --blue:#5b8cff;
    --blue-dim:#1c2e5c;
    --cyan:#29e0ff;
    --cyan-dim:#103544;
    --red:#ff4d6d;
    --red-dim:#3a1520;
    --green:#38e6a8;
    --green-dim:#0f3a2c;
    --purple:#b48bff;
    --purple-dim:#2a2050;
    --amber:#ffb63d;
    --amber-dim:#3a2708;

    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top: env(safe-area-inset-top, 0px);}
  html,body{height:100%; margin:0; padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 20% -10%, rgba(41,224,255,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(180,139,255,0.07), transparent 55%),
      repeating-linear-gradient(0deg, var(--bg-grid) 0px, var(--bg-grid) 1px, transparent 1px, transparent 34px),
      repeating-linear-gradient(90deg, var(--bg-grid) 0px, var(--bg-grid) 1px, transparent 1px, transparent 34px),
      var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Mono', monospace;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Space Grotesk', sans-serif;
    letter-spacing:0.01em;
    margin:0;
  }
  a{color:var(--cyan);}
  .label-font{ font-family:'Space Grotesk',sans-serif; letter-spacing:.04em; }

  /* ============ HEADER ============ */
  header{
    display:flex;
    align-items:center;
    gap:18px;
    padding:18px 24px;
    border-bottom:1px solid var(--line-bright);
    background:linear-gradient(180deg, var(--panel-2), var(--panel));
    position:sticky;
    top:0;
    z-index:20;
    box-shadow: 0 1px 0 rgba(41,224,255,0.15), 0 8px 24px rgba(0,0,0,0.35);
  }
  .badge{
    width:52px;height:52px;flex-shrink:0;
    border:1.5px solid var(--cyan);
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    color:var(--cyan);
    background:radial-gradient(circle at 30% 20%, rgba(41,224,255,0.18), rgba(41,224,255,0.03));
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:12px;
    letter-spacing:0.03em;
    box-shadow: 0 0 18px rgba(41,224,255,0.35), inset 0 0 14px rgba(41,224,255,0.12);
  }
  header h1{ font-size:18px; margin:0; font-weight:600; color:var(--ink); line-height:1.25;}
  header p{ margin:4px 0 0; font-size:12px; color:var(--ink-dim); font-family:'IBM Plex Mono',monospace; display:flex; align-items:center; gap:7px;}
  header p::before{
    content:""; width:6px; height:6px; border-radius:50%;
    background:var(--green); box-shadow:0 0 8px var(--green);
    animation:pulse 2s ease-in-out infinite;
    flex-shrink:0;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  main{
    max-width:1180px;
    margin:0 auto;
    padding:30px 22px 90px;
  }

  .group-title{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'Space Grotesk',sans-serif;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.06em;
    color:var(--ink);
    margin:40px 0 14px;
    padding:0 0 9px;
    width:100%;
    border-bottom:1px solid var(--line);
    position:relative;
  }
  .group-title::before{
    content:""; width:9px; height:9px; border-radius:2px;
    background:var(--blue); box-shadow:0 0 8px var(--blue);
    flex-shrink:0;
  }
  .group-title:first-of-type{margin-top:4px;}
  .group-title[data-g="Field Operations"]::before{background:var(--cyan); box-shadow:0 0 8px var(--cyan);}
  .group-title[data-g="Enforcement & Custody"]::before{background:var(--red); box-shadow:0 0 8px var(--red);}
  .group-title[data-g="Quick Reference"]::before{background:var(--green); box-shadow:0 0 8px var(--green);}
  .group-title[data-g="Legal Code"]::before{background:var(--purple); box-shadow:0 0 8px var(--purple);}
  .group-title[data-g="Practice"]::before{background:var(--amber); box-shadow:0 0 8px var(--amber);}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    gap:12px;
  }
  .card-btn{
    all:unset;
    cursor:pointer;
    position:relative;
    background:linear-gradient(160deg, var(--panel-2), var(--panel));
    border:1px solid var(--line);
    border-left:2px solid var(--blue);
    border-radius:8px;
    padding:16px 16px 14px;
    display:flex;
    flex-direction:column;
    gap:9px;
    min-height:118px;
    transition:border-color .15s ease, box-shadow .15s ease, transform .15s ease;
  }
  .card-btn:hover{
    transform:translateY(-2px);
    border-color:var(--line-bright);
    box-shadow: 0 10px 26px rgba(0,0,0,0.35), 0 0 0 1px var(--line-bright);
  }
  .card-btn:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }
  .grid[data-g="Field Operations"] .card-btn, .card-btn[data-g="Field Operations"]{border-left-color:var(--cyan);}
  .card-btn[data-g="Field Operations"]:hover{box-shadow: 0 10px 26px rgba(0,0,0,0.35), 0 0 22px rgba(41,224,255,0.18);}
  .card-btn[data-g="Enforcement & Custody"]{border-left-color:var(--red);}
  .card-btn[data-g="Enforcement & Custody"]:hover{box-shadow: 0 10px 26px rgba(0,0,0,0.35), 0 0 22px rgba(255,77,109,0.18);}
  .card-btn[data-g="Quick Reference"]{border-left-color:var(--green);}
  .card-btn[data-g="Quick Reference"]:hover{box-shadow: 0 10px 26px rgba(0,0,0,0.35), 0 0 22px rgba(56,230,168,0.18);}
  .card-btn[data-g="Legal Code"]{border-left-color:var(--purple);}
  .card-btn[data-g="Legal Code"]:hover{box-shadow: 0 10px 26px rgba(0,0,0,0.35), 0 0 22px rgba(180,139,255,0.18);}
  .card-btn[data-g="Practice"]{border-left-color:var(--amber);}
  .card-btn[data-g="Practice"]:hover{box-shadow: 0 10px 26px rgba(0,0,0,0.35), 0 0 22px rgba(255,182,61,0.18);}
  .card-btn[data-g="Conduct & Command"]:hover{box-shadow: 0 10px 26px rgba(0,0,0,0.35), 0 0 22px rgba(91,140,255,0.18);}
  .card-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .card-num{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--ink-faint);
    letter-spacing:.06em;
  }
  .card-tag{
    font-family:'Space Grotesk',sans-serif;
    font-size:10px;
    font-weight:600;
    letter-spacing:.03em;
    padding:2px 8px;
    border-radius:9px;
    background:rgba(41,224,255,.08);
    color:var(--cyan);
    border:1px solid rgba(41,224,255,.3);
  }
  .card-btn h3{
    margin:0;
    font-size:16.5px;
    color:var(--ink);
    font-weight:600;
    font-family:'Space Grotesk',sans-serif;
    letter-spacing:0;
  }
  .card-btn .teaser{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--ink-dim);
    line-height:1.45;
  }

  /* ============ MODAL ============ */
  .overlay{
    position:fixed; inset:0;
    background:rgba(3,5,9,.7);
    backdrop-filter:blur(3px);
    display:none;
    align-items:flex-start;
    justify-content:center;
    padding:5vh 18px;
    z-index:100;
    overflow-y:auto;
  }
  .overlay.open{display:flex; animation:fadeBg .15s ease;}
  @keyframes fadeBg{from{opacity:0;} to{opacity:1;}}

  .modal{
    background:var(--panel);
    border:1px solid var(--line-bright);
    border-radius:12px;
    width:100%;
    max-width:840px;
    box-shadow: 0 24px 70px rgba(0,0,0,0.5), 0 0 0 1px rgba(41,224,255,0.08);
    animation:pop .18s ease;
  }
  @keyframes pop{from{opacity:0; transform:translateY(10px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);}}

  .modal-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:20px;
    padding:20px 24px 16px;
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    background:var(--panel);
    border-radius:12px 12px 0 0;
  }
  .modal-head .panel-eyebrow{margin-bottom:6px;}
  .modal-head h2{ font-size:22px; margin:0; color:var(--ink); font-weight:600; }
  .modal-close{
    all:unset;
    cursor:pointer;
    width:32px;height:32px;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    border-radius:8px;
    color:var(--ink-dim);
    font-family:'Space Grotesk',sans-serif;
    font-size:15px;
    border:1px solid var(--line);
    transition:border-color .12s, color .12s, box-shadow .12s;
  }
  .modal-close:hover{ color:var(--red); border-color:var(--red); box-shadow:0 0 12px rgba(255,77,109,0.3); }
  .modal-body{ padding:20px 24px 30px; }

  .panel-eyebrow{
    font-family:'Space Grotesk',sans-serif;
    color:var(--cyan);
    font-size:11px;
    font-weight:600;
    letter-spacing:.1em;
    text-transform:uppercase;
  }
  h3{ font-size:14.5px; color:var(--cyan); margin:26px 0 10px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; font-family:'Space Grotesk',sans-serif;}
  h3:first-child{margin-top:0;}

  p{color:var(--ink); max-width:70ch;}
  ul{padding-left:20px; margin:8px 0 18px;}
  li{margin-bottom:7px; max-width:66ch;}
  li::marker{color:var(--cyan);}

  .callout{
    background:rgba(41,224,255,0.06);
    border-left:2px solid var(--cyan);
    padding:13px 16px;
    margin:16px 0;
    border-radius:0 6px 6px 0;
    font-size:13.5px;
  }
  .callout.warn{border-left-color:var(--red); background:rgba(255,77,109,0.07);}
  .callout.warn strong{color:var(--red);}
  .callout strong{color:var(--cyan);}

  .chip{
    display:inline-block;
    font-family:'Space Grotesk',sans-serif;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.03em;
    text-transform:uppercase;
    padding:2px 9px;
    border-radius:10px;
  }
  .chip.green{background:var(--green-dim); color:var(--green); border:1px solid rgba(56,230,168,.4);}
  .chip.amber{background:var(--amber-dim); color:var(--amber); border:1px solid rgba(255,182,61,.4);}
  .chip.red{background:var(--red-dim); color:var(--red); border:1px solid rgba(255,77,109,.4);}

  table{ width:100%; border-collapse:collapse; margin:14px 0 22px; font-size:13px; font-family:'IBM Plex Mono',monospace; }
  th,td{ text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th{ color:var(--cyan); font-weight:600; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; font-family:'Space Grotesk',sans-serif;}
  tr:hover td{background:rgba(41,224,255,0.04);}

  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }

  .pyramid-mini{ display:flex; flex-direction:column; gap:3px; margin:16px 0 24px; max-width:520px; }
  .pyr-row{ font-family:'Space Grotesk',sans-serif; font-size:12.5px; font-weight:600; padding:9px 14px; border-radius:5px; display:flex; justify-content:space-between; gap:12px; border:1px solid var(--line-bright);}
  .pyr-row span.desc{color:rgba(255,255,255,.65); text-align:right; font-family:'IBM Plex Mono',monospace; font-weight:400;}
  .pyr-1{background:rgba(56,230,168,.14); color:var(--green); width:60%; align-self:center; border-color:rgba(56,230,168,.4);}
  .pyr-2{background:rgba(91,140,255,.14); color:var(--blue); width:70%; align-self:center; border-color:rgba(91,140,255,.4);}
  .pyr-3{background:rgba(255,182,61,.14); color:var(--amber); width:82%; align-self:center; border-color:rgba(255,182,61,.4);}
  .pyr-4{background:rgba(255,77,109,.16); color:var(--red); width:96%; align-self:center; border-color:rgba(255,77,109,.45);}
  .pyr-1 span.desc,.pyr-2 span.desc,.pyr-3 span.desc,.pyr-4 span.desc{color:inherit; opacity:.75;}

  .code-table{ width:100%; border-collapse:separate; border-spacing:0 4px; font-family:'IBM Plex Mono',monospace; font-size:12.5px; }
  .code-table td{ padding:6px 10px; border:none; }
  .code-row{ background:var(--panel-2); }
  .code-badge{
    display:inline-block;
    min-width:56px;
    text-align:center;
    padding:3px 8px;
    border-radius:4px;
    font-weight:700;
    font-size:11px;
    font-family:'Space Grotesk',sans-serif;
    border:1px solid transparent;
  }
  .code-b{background:var(--cyan-dim); color:var(--cyan); border-color:rgba(41,224,255,.4);}
  .code-g{background:var(--green-dim); color:var(--green); border-color:rgba(56,230,168,.4);}
  .code-r{background:var(--red-dim); color:var(--red); border-color:rgba(255,77,109,.4);}
  .code-cols{ display:grid; grid-template-columns:1fr 1fr; gap:0 22px; }
  @media (max-width:640px){.code-cols{grid-template-columns:1fr;}}

  .small-note{ font-size:12.5px; color:var(--ink-dim); font-family:'IBM Plex Mono',monospace; margin:4px 0 14px; }

  .callout-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px 18px; margin-bottom:8px; }
  .callout-card{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:6px;
    padding:9px 12px;
  }
  .callout-card .head{
    display:flex; align-items:center; gap:9px;
    font-family:'Space Grotesk',sans-serif;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:5px;
  }
  .callout-card .ex{
    font-size:12px;
    color:var(--ink-dim);
    font-family:'IBM Plex Mono',monospace;
    line-height:1.4;
  }
  @media (max-width:640px){.callout-grid{grid-template-columns:1fr;}}

  .quiz-progress{ font-family:'Space Grotesk',sans-serif; font-size:12px; font-weight:600; color:var(--cyan); margin-bottom:12px; letter-spacing:.03em; }
  .quiz-progress-row{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; margin-bottom:12px;
  }
  .quiz-progress{ margin-bottom:0; }
  .quiz-shuffle-btn{
    all:unset; cursor:pointer;
    font-family:'Space Grotesk',sans-serif; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.03em;
    color:var(--ink-dim);
    border:1px solid var(--line-bright); border-radius:12px;
    padding:5px 12px;
    white-space:nowrap;
    transition:border-color .12s, color .12s, box-shadow .12s;
  }
  .quiz-shuffle-btn:hover{ color:var(--cyan); border-color:var(--cyan); box-shadow:0 0 10px rgba(41,224,255,.25); }
  .quiz-qnum{ color:var(--cyan); }
  .quiz-prompt{ font-size:16px; margin-bottom:14px; color:var(--ink); font-weight:600; font-family:'Space Grotesk',sans-serif; letter-spacing:0;}
  .quiz-hint-btn{
    all:unset; cursor:pointer;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px; color:var(--ink-dim);
    text-decoration:underline;
    margin-bottom:12px; display:inline-block;
  }
  .quiz-hint-btn:hover{color:var(--cyan);}
  .quiz-hint-text{ font-size:12.5px; color:var(--ink-dim); margin:-4px 0 14px; font-family:'IBM Plex Mono',monospace; font-style:italic;}
  .quiz-options-grid{ display:flex; flex-direction:column; gap:8px; margin-bottom:4px; }
  .quiz-option{
    all:unset; cursor:pointer; width:100%;
    box-sizing:border-box;
    display:flex; align-items:center; gap:11px;
    padding:10px 15px; margin-bottom:0;
    border:1px solid var(--line-bright); border-radius:8px;
    background:var(--panel-2); color:var(--ink);
    font-family:'IBM Plex Mono',monospace; font-size:13.5px;
    transition:border-color .12s, background .12s, transform .1s, box-shadow .12s;
  }
  .quiz-opt-letter{
    flex-shrink:0;
    width:24px; height:24px;
    display:flex; align-items:center; justify-content:center;
    border-radius:5px;
    border:1px solid var(--line-bright);
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:11.5px;
    color:var(--ink-dim);
    transition:border-color .12s, color .12s, background .12s;
  }
  .quiz-opt-text{ flex:1; line-height:1.45; }
  .quiz-option:hover:not(.disabled){ border-color:var(--cyan); transform:translateX(2px); box-shadow:0 0 10px rgba(41,224,255,.15);}
  .quiz-option:hover:not(.disabled) .quiz-opt-letter{ border-color:var(--cyan); color:var(--cyan); }
  .quiz-option.selected{ border-color:var(--cyan); background:rgba(41,224,255,.08); box-shadow:0 0 12px rgba(41,224,255,.2); }
  .quiz-option.selected .quiz-opt-letter{ border-color:var(--cyan); background:var(--cyan); color:#04141a; }
  .quiz-option.correct{ border-color:var(--green); background:rgba(56,230,168,.12); box-shadow:0 0 14px rgba(56,230,168,.2); }
  .quiz-option.correct .quiz-opt-letter{ border-color:var(--green); background:var(--green); color:#04221a; }
  .quiz-option.incorrect{ border-color:var(--red); background:rgba(255,77,109,.12); box-shadow:0 0 14px rgba(255,77,109,.2); }
  .quiz-option.incorrect .quiz-opt-letter{ border-color:var(--red); background:var(--red); color:#2a0810; }
  .quiz-option.disabled{ cursor:default; }
  #quizSubmitBtn:disabled{
    opacity:.35; cursor:not-allowed; box-shadow:none !important; transform:none !important;
  }
  .quiz-feedback{
    margin-top:6px; padding:13px 16px; border-radius:0 8px 8px 0;
    background:rgba(56,230,168,0.06); border-left:2px solid var(--green);
    font-size:13.5px;
  }
  .quiz-feedback.wrong{ border-left-color:var(--red); background:rgba(255,77,109,0.06);}
  .quiz-feedback strong{ color:var(--ink); display:block; margin-bottom:3px; font-family:'Space Grotesk',sans-serif; text-transform:uppercase; font-size:11.5px; letter-spacing:.05em;}
  .quiz-nav{ display:flex; justify-content:flex-end; margin-top:18px; }
  .quiz-btn{
    all:unset; cursor:pointer;
    background:var(--cyan); color:#04141a;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12.5px; text-transform:uppercase; letter-spacing:.04em;
    padding:10px 20px; border-radius:7px;
    box-shadow:0 0 16px rgba(41,224,255,.35);
    transition:box-shadow .12s, transform .12s;
  }
  .quiz-btn:hover{ box-shadow:0 0 22px rgba(41,224,255,.55); transform:translateY(-1px); }
  .quiz-score{ text-align:center; padding:34px 10px 12px; }
  .quiz-score .big{ font-size:46px; color:var(--cyan); font-weight:700; font-family:'Space Grotesk',sans-serif; text-shadow:0 0 26px rgba(41,224,255,.4);}
  .quiz-score p{ max-width:100%; }

  .modal.wide{ max-width:980px; }

  .pc-search-wrap{
    position:sticky; top:0; z-index:3;
    background:var(--panel);
    padding-bottom:12px; margin-bottom:10px;
    border-bottom:1px solid var(--line);
  }
  .pc-search{
    width:100%; box-sizing:border-box;
    padding:11px 14px; border-radius:8px;
    border:1px solid var(--line-bright);
    background:var(--panel-2); color:var(--ink);
    font-family:'IBM Plex Mono',monospace; font-size:13.5px;
  }
  .pc-search::placeholder{ color:var(--ink-faint); }
  .pc-search:focus{ outline:none; border-color:var(--cyan); box-shadow:0 0 12px rgba(41,224,255,.2); }
  .pc-no-results{ font-family:'IBM Plex Mono',monospace; color:var(--ink-dim); font-size:13px; padding:14px 4px; display:none; }

  .pc-group{
    border:1px solid var(--line); border-radius:8px;
    margin-bottom:10px; overflow:hidden;
    background:var(--panel);
  }
  .pc-group summary{
    cursor:pointer; list-style:none;
    padding:12px 16px;
    background:var(--panel-2);
    font-family:'Space Grotesk',sans-serif;
    font-weight:600; font-size:13px; color:var(--cyan); letter-spacing:.02em;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }

    teaser:"Channel assignments, 10-code use, Signal 100.",
    body:`
      <ul>
        <li>Channels 1–100 are encrypted, government-only.</li>
        <li><strong>Radio 1</strong> = regular PD patrol · <strong>Radio 5</strong> = DOC · <strong>Radio 90–99</strong> = EMS</li>
        <li>Radio 16 (CID) and 20 (SAO) can't be used as TAC channels for calls.</li>
        <li>Lead every transmission with your callsign; keep it short.</li>
        <li>No general chatter on Radio 1 — switch TAC, use a phone, or talk in person.</li>

  traffic:{
    title:"Traffic Stops",
    eyebrow:"Stops & tickets",
    teaser:"Standard stop steps, Code 5 felony stop, license/plate rules.",
    body:`
      <h3>Standard stop — sequence</h3>
      <ul>
        <li>Call it in: callsign, location, heading, vehicle description, occupants, 77s/78s as needed. Run the plate first if possible.</li>
        <li>Confirm engine off + window down (loudspeaker helps).</li>
        <li>Identify yourself and the reason for the stop; show your badge.</li>
        <li>No masks/face coverings; check for a valid license (unexpired, clear face, no group photo).</li>
        <li>Document the ID with the person who presented it.</li>
        <li>Return to your vehicle, look up info, write any tickets.</li>
        <li>Explain next steps — citations can be appealed within <strong>14 days</strong>; unpaid fines auto-deduct as a No Contest plea.</li>
      </ul>
      <div class="callout warn">Only <strong>infractions</strong> get fines sent through the MDT. Never send misdemeanor or felony fines through the MDT.</div>
      <h3>Felony / Code 5 stop</h3>
      <ul>
        <li>Request backup with the reason for the Code 5.</li>
        <li>Arriving units position left and right of the initiating officer.</li>
        <li>Suspect told to turn off vehicle; on countdown, all officers exit with doors open for cover, weapons drawn (taser ready if assigned). Watch your line of fire.</li>
        <li>Occupants exit one at a time on the lead officer's clear instructions.</li>
        <li>Once detained, two officers clear doors and trunk.</li>
        <li>Proceed with the stop as normal.</li>
      </ul>
      <h3>Extra reminders</h3>
      <ul>
        <li>Stay respectful, explain the infraction.</li>
        <li>A valid, physical driver's license is required to drive in San Andreas.</li>
        <li>A visible plate is required — "no option for a plate" isn't a valid excuse.</li>
      </ul>
    `
  },
  crime:{
    title:"Criminal Activities & Response",
    eyebrow:"Call caps",
    teaser:"Officer/unit limits and the full responding-unit allowance table.",
    body:`
      <ul>
        <li><strong>10 officers max</strong> on any situation, with an exception for suspects swapping into 3+ cars at once (up to 2 cars per involved vehicle). Any call that turns into a shootout raises the cap to 10.</li>
        <li><strong>Any call that draws 5 units</strong> (Vangelico's, Pacific Standard, Paleto Bank, Gruppe Sechs): hostage demands can never deny Air-1 or MOTO — those demands are always voided. Denying a certification vehicle is only ever on the table for smaller crimes.</li>
        <li><strong>Fleeca / Art Gallery (small crimes):</strong> suspects can deny only one certification vehicle (e.g., no Air-1 <em>or</em> no MOTO, not both).</li>
        <li><strong>Safe House:</strong> 4 units, no certification required to respond — no Air-1, no MOTO/bike, except an officer who's already on a bike may stay on it (you just can't call one in fresh).</li>
      </ul>
      <h3>Counting officers & units</h3>
      <ul>
        <li>Every officer = 1. K9s and unarmed/civilian ride-alongs don't count toward the 10.</li>
        <li>A unit = a vehicle, max 3 officers each. A MOTO "tandem" (2 bikes) = 1 unit.</li>
        <li>Helicopters don't count as a unit, but the officers inside still count toward the officer cap.</li>
        <li>Staying within limits is everyone's job, but ultimately falls on the highest-ranking officer on the call.</li>
      </ul>
      <h3>Responding unit allowances (by call type)</h3>
      <table>
        <tr><th>Crime</th><th>Units</th><th>Max Officers</th><th>Air-1</th><th>Moto</th><th>Interceptor</th></tr>
        <tr><td>10-13A (not scene/cleanup)</td><td>Unlimited</td><td>Unlimited</td><td>Yes</td><td>N/A</td><td>Yes*</td></tr>
        <tr><td>Shootout w/ officers (OIS)</td><td>10</td><td>10</td><td>Yes</td><td>N/A</td><td>Yes*</td></tr>
        <tr><td>Gruppe Sechs (G6)</td><td>5</td><td>10†</td><td>Yes</td><td>Yes</td><td>Yes</td></tr>
        <tr><td>Pacific Standard / Paleto</td><td>5</td><td>10†</td><td>Yes</td><td>Yes</td><td>Yes</td></tr>
        <tr><td>Vangelico's</td><td>5</td><td>10†</td><td>Yes</td><td>Yes</td><td>Yes</td></tr>
        <tr><td>Bank Robbery / Art Gallery</td><td>4</td><td>10†</td><td>Yes</td><td>Yes</td><td>No (vehicle dep.)</td></tr>
        <tr><td>Bank Truck</td><td>6</td><td>10 (2 shields max)</td><td>Yes</td><td>Yes</td><td>No</td></tr>
        <tr><td>Store / Container Robbery</td><td>3</td><td>10†</td><td>No</td><td>No (vehicle dep.)</td><td>No</td></tr>
        <tr><td>Vehicle Boost: Class X</td><td>3</td><td>10†</td><td>Yes</td><td>Yes (max 2 MEAT, bikes)</td><td>Yes (max 2 HEAT)</td></tr>
        <tr><td>Vehicle Boost: Class S</td><td>3</td><td>10†</td><td>Yes</td><td>Yes (max 2 MEAT, bikes)</td><td>Yes (max 1 HEAT)</td></tr>
        <tr><td>Vehicle Boost: Class D/C/B/A</td><td>3</td><td>10†</td><td>No</td><td>No (unless bike)</td><td>No</td></tr>
        <tr><td>Prison Transport (10-86)</td><td>7</td><td>15 (incl. DOC w/ lethals)</td><td>Yes</td><td>No</td><td>No</td></tr>
        <tr><td>Safe House</td><td>4</td><td>10†</td><td>No</td><td>No (unless already on one)</td><td>No</td></tr>
        <tr><td>Any unlisted call</td><td>3</td><td>10†</td><td>N/A</td><td>N/A</td><td>N/A</td></tr>
      </table>
      <p style="font-size:12.5px;color:var(--ink-dim);">* if already in HEAT · † rises to 10 automatically if the call becomes a shootout</p>
    `
  },
  cleanup:{
    title:"Cleanup Protocol",
    eyebrow:"Mass-casualty scenes",
    teaser:"The 60-second timer after all officers are down, then triage.",
    body:`
      <ul>
        <li>Triggered when all 10 officers on a scene are incapacitated. Cleanup can stage early on a separate call/radio, staying clear until needed.</li>
        <li>Once the last original officer goes down (13A), a <strong>60-second timer</strong> starts — ideally announced by an air unit's loudspeaker — telling suspects to grab their people and leave before cleanup moves in, and warning them not to rob officers.</li>
        <li>Anyone caught robbing officers during or after the timer gets fired upon by cleanup, regardless of the timer status.</li>
        <li>If suspects are still on scene after 60 seconds and not leaving/still robbing, a <strong>Sergeant</strong> can call Code Red (or the highest officer present if no sergeant is available).</li>
      </ul>
      <h3>Once the scene is Code 4</h3>
      <ul>
        <li>First priority: triage downed officers — stop bleeding, check breathing/heart rate, wait for EMS.</li>
        <li>Once stable, a small group detaches to collect evidence: shell casings, blood samples, document leftover vehicles.</li>
        <li>All evidence goes into an <strong>evidence report</strong> forwarded to CID ASAP.</li>
      </ul>
    `
  },
  gang:{
    title:"Gang Activity Response",
    eyebrow:"Gang fights & blocks",
    teaser:"Fight timers by location, robbing rule, gang block push cap.",
    body:`
      <h3>Gang fights</h3>
      <ul>
        <li><strong>Outside the Southside:</strong> stop it fast — once a perimeter is up, give both sides a <strong>2-minute</strong> warning (air unit loudspeaker preferred) before PD moves in. Still fighting after that → a supervisor can Code Red the shooter(s).</li>
        <li><strong>Inside the Southside:</strong> more leniency — a <strong>15-minute</strong> window from the first warning before units move in and Code Red shooters (once cleared by a supervisor).</li>
        <li>Both sides are told not to rob — looting after the warning gets suspects fired on regardless of the timer. A Sergeant can Code Red a specific suspect caught robbing a downed suspect, even their own gang member.</li>
        <li>Response cap: <strong>10 officers per gang involved</strong>, rising to 10 if officers join the shootout. If the chase splits, try to run it as two separate calls.</li>
        <li>Primary objective is rendering aid — stay on scene for downed suspects/evidence; chase evaders only if units can be spared.</li>
        <li><strong>All gang members are arrested</strong> from a gang fight, chased or not. Catch-and-release only applies if a detained member is both GSR-negative <em>and</em> has no illegal possessions — never released just for losing a fight (reductions can be offered instead if you feel for them).</li>
      </ul>
      <h3>Gang blocks</h3>
      <p>Gangs don't legally own their turf — you can tell them to leave — but expect it to aggravate them, so stay vigilant. Pushing a block with more than <strong>5 suspects</strong> allows up to <strong>20 officers</strong> on the call.</p>
    `
  },
  suspects:{
    title:"Suspect Interactions",
    eyebrow:"Stops, rights & arrests",
    teaser:"Reasonable suspicion, probable cause, full arrest checklist.",
    body:`
      <div class="two-col">
        <div>
          <h3>Reasonable Suspicion</h3>
          <p>Specific facts or circumstances — more than a hunch — that justify stopping and questioning someone, and a Terry frisk for weapons if justified. Feeling something that could be a weapon → probable cause for a search. Allows detain + question.</p>
        </div>
        <div>
          <h3>Probable Cause</h3>
          <p>Facts/circumstances that would lead a reasonable person to believe a crime was, is, or is about to be committed — e.g. contraband in plain view/smell, or an admission of guilt. Minor traffic violations alone are <strong>not</strong> probable cause to search. Required for search & seizure or arrest.</p>
        </div>
      </div>
      <h3>Detention vs. arrest</h3>
      <ul>
        <li><strong>Detention:</strong> temporarily not free to leave, clearly communicated — cuffs not required, but the person must follow lawful commands (e.g. a traffic stop).</li>
        <li><strong>Arrest:</strong> taken into custody, charges formally being placed.</li>
      </ul>
      <h3>A suspect's rights</h3>
      <ul>
        <li>Check for injury first and offer medical help — injuries in custody are a liability that falls on the officer.</li>
        <li>Read Miranda Rights once health is confirmed; the suspect must confirm they understand.</li>
        <li>Always offer an attorney and note their answer; make sure they don't need food/water.</li>
        <li>Right to speedy processing — get charges filed and a plea taken before writing reports.</li>
      </ul>
      <h3>Arrest checklist (suspect already cuffed)</h3>
      <ul>
        <li>Make sure they're not dying — patch bleeding, call EMS if needed.</li>
        <li>Search + photograph pockets/bags, weapon serials, ID cards.</li>
        <li>Hospital if needed → read Miranda rights → transport to station, offer a lawyer.</li>
        <li>Confirm fingerprints/MDT photo are current (update if not); DNA on file for violent felonies.</li>
        <li>Search again — no phones, radios, weapons, drugs, alcohol, spraycans, lockpicks, spy cameras, lighters, mics, jukeboxes, or other illegal items.</li>
        <li>Lock in holding cell, uncuff through the bars.</li>
        <li>Write the report with charges + photos; pull any felony weapon license if applicable.</li>
        <li>Negotiate with a lawyer if present/requested — no reductions for government-issued item/police weapon possession charges (Class 1–3), even with a lawyer.</li>
        <li>After plea: fine + send to jail (check DOC availability; remove masks/gang identifiers first).</li>
        <li>Evidence → evidence locker (non-returnable). Confiscated-but-returnable items → suspect's Confiscation locker (needs CID). Phone/radio/lighter can be returned before transport if going "locally."</li>
        <li>Write the full report, attach evidence and photos → back <strong>10-8</strong>.</li>
      </ul>
      <h3>Community service</h3>
      <ul>
        <li>Can replace sentencing hours for nonviolent felonies/misdemeanors, negotiated with a lawyer or set by the arresting officer/command.</li>
        <li>Tasks = months that would've been served × <strong>1.5</strong> or <strong>2</strong> (e.g. 10 months → 15 or 20 tasks).</li>
        <li>Approved locations: Legion Park, Las Lagunas Park, Recreation Center (Forum Dr), Courthouse (Rockford Hills), Sandy Shores Marina, Dignity Village (Paleto).</li>
        <li>Via the Police utility belt → Community Service → select location → set task count; return confiscated items and release once complete.</li>
      </ul>
      <h3>Reductions & time served</h3>
      <div class="callout">Use the <strong>Penal Code</strong> for sentencing reference. Always ask if a lawyer is wanted (check yellow pages / DOJ app / services app).</div>
      <ul>
        <li>Up to <strong>20%</strong> fine reduction: Supervisor+ (must have exhausted efforts to get a lawyer).</li>
        <li>Up to <strong>30%</strong>: Command+ (same requirement).</li>
        <li><strong>40% is the absolute max</strong>, even with a lawyer present — reductions are a privilege, not a right.</li>
        <li>Government-issued item / police weapon possession charges: never eligible for reduction.</li>
        <li><strong>Time served is mandatory</strong>, not a reduction — PD-caused delays get added to it; only the suspect's own fault (e.g. being unresponsive) is exempt.</li>
      </ul>
    `
  },
  warrants:{
    title:"Warrants & BOLOs",
    eyebrow:"Flags",
    teaser:"How to issue, approve, and serve a warrant or BOLO.",
    body:`
      <h3>Warrants</h3>
      <ul>
        <li>Used to arrest someone not currently present. Requires positive ID + probable cause.</li>
        <li>Write the report and attach charges as if arresting, but mark it as a warrant. Only for felony or capital charges.</li>
        <li>Approved by a Sergeant+ or a State's Attorney's Office member, who logs their name, callsign, and date/time.</li>
        <li>Be extra detailed — you likely won't be there for processing, and someone else needs to fully understand the charges.</li>
        <li>When served: the finding officer runs a normal arrest, plus an incident report for the scene they found them on (if needed), <em>and</em> serves the warrant charges separately. Pleading/negotiating is handled separately per report, but time/fine combine.</li>
        <li>After serving, mark the warrant "served" with your name, callsign, date/time.</li>
      </ul>
      <h3>BOLOs</h3>
      <ul>
        <li>"Be On the Look Out" — flags a vehicle; your radar auto-recognizes active BOLOs.</li>
        <li>Used for vehicles fleeing cops or otherwise sought for a crime.</li>
        <li>Report needs enough detail that someone with zero context on the original scene could still gather evidence.</li>
        <li>Anyone in SASP can issue one, no approval needed — but the issuer is responsible for keeping it current and disabling it when it's no longer needed.</li>
      </ul>
    `
  },
  discipline:{
    title:"Disciplinary Actions",
    eyebrow:"Accountability",
    teaser:"Strike escalation, expungement timeline, at-will status.",
    body:`
      <ul>
        <li>Grounds include unprofessional conduct, SOP violations, insubordination, or failing basic duties.</li>
        <li><strong>Corporal+</strong> can send someone off duty for 24 hours and issue verbal/written warnings.</li>
        <li><strong>Sergeant+</strong> can issue strikes and suspensions.</li>
      </ul>
      <h3>Strike escalation</h3>
      <ol style="padding-left:20px;">
        <li>No extra restrictions</li>
        <li>Can't earn new certifications, transfer departments, or be promoted</li>
        <li>All earned certifications held (including TAC-cert)</li>
        <li>Potential suspension and/or demotion</li>
        <li>Termination</li>
      </ol>
      <div class="callout">Strikes expunge <strong>30 days</strong> after issuance via a command member — but a new strike before expungement resets the 30-day timer and keeps everything active.</div>
      <ul>
        <li>LOA requests go through the form in LEO Documents (SASP emails).</li>
        <li>SASP is an <strong>at-will employer</strong> — termination can happen anytime, without cause, as long as it isn't sexually, racially, or religiously motivated.</li>
      </ul>
    `
  },

    title:"Case Law",
    eyebrow:"Legal reference",
    teaser:"The key precedents behind stops, searches, and Miranda.",
    body:`
      <div class="caselaw-card">
        <h4>Tennessee v. Garner, 471 U.S. 1 (1985)</h4>
        <p>Deadly force to stop a fleeing felon is only justified if necessary to prevent the escape and the officer has probable cause to believe the suspect poses a significant threat of death or serious physical injury to the officer or others.</p>
      </div>
      <div class="caselaw-card">
        <h4>Terry v. Ohio, 392 U.S. 1 (1968)</h4>
        <p>An officer can briefly detain someone based on reasonable suspicion of criminal activity, long enough to dispel the suspicion or let it rise to probable cause for arrest, and may do a limited "frisk" for weapons without a warrant. To frisk, the officer must have articulable facts the person could be armed, limit the search to patting outer garments for weapon-like objects, and only reach inside clothing after feeling such an object.</p>
      </div>
      <div class="caselaw-card">
        <h4>Wyoming v. Houghton, 526 U.S. 295 (1999)</h4>
        <p>Absent exigency, a warrantless search of a passenger's container capable of holding the object of a search doesn't violate the Fourth Amendment when justified under the automobile exception.</p>
      </div>
      <div class="caselaw-card">
        <h4>Miranda v. Arizona, 384 U.S. 436 (1966)</h4>
        <p>A statement made during custodial interrogation is presumed involuntary without Miranda warnings. "Custody" means an arrest or equivalent deprivation of freedom; "interrogation" means words or actions meant to elicit an incriminating response.</p>
      </div>
      <div class="caselaw-card">
        <h4>Carroll v. U.S., 267 U.S. 132 (1925)</h4>
        <p>Police may conduct a warrantless search of a vehicle stopped in traffic if there's probable cause to believe it contains contraband or evidence.</p>
      </div>
      <div class="caselaw-card">
        <h4>Pennsylvania v. Mimms, 434 U.S. 106 (1977)</h4>
        <p>Ordering a person out of a car following a traffic stop does not violate the Fourth Amendment. A pat-down still requires reasonable suspicion the person is armed and dangerous (per Terry v. Ohio).</p>
      </div>
      <div class="caselaw-card">
        <h4>Maryland v. King, 569 U.S. 435 (2013)</h4>
        <p>A cheek swab of an arrestee's DNA is comparable to fingerprinting — a reasonable, legal booking procedure under the Fourth Amendment, but only when charging the arrestee with a <span style="color:var(--red);">violent</span> crime.</p>
      </div>
      <div class="caselaw-card">
        <h4>De-Luca v. State of San Andreas (2023)</h4>
        <p>San Andreas has no express "delayed death" exception, but the court recognizes its necessity. Because Los Santos arraignments often happen minutes after arrest, followed immediately by pleas, the court acknowledges a "delayed death" exception to double jeopardy to safeguard due process.</p>
      </div>
      <div class="caselaw-card">
        <h4>Brady v. Maryland (1963)</h4>
        <p>Withholding evidence material to guilt or punishment violates a defendant's constitutional right to due process.</p>
        <p style="margin-top:8px;"><a href="https://drive.google.com/file/d/1yVAa9JDWNShDNCOg_WH1ZH2ioslaTpPq/view" target="_blank" rel="noopener">More info →</a></p>
      </div>
    `

const main = document.getElementById('main');
groups.forEach(group => {
  const h = document.createElement('div');
  h.className = 'group-title';
  h.textContent = group.title;
  h.setAttribute('data-g', group.title);
  main.appendChild(h);

  const grid = document.createElement('div');
  grid.className = 'grid';
  group.items.forEach((id) => {
    const s = sections[id];
    const btn = document.createElement('button');
    btn.className = 'card-btn';
    btn.setAttribute('data-g', group.title);
    btn.innerHTML = `
      <div class="card-top">
        <span class="card-num">${id.toUpperCase()}</span>
        <span class="card-tag">${s.eyebrow}</span>
      </div>
      <h3>${s.title}</h3>
      <div class="teaser">${s.teaser}</div>
    `;
    btn.addEventListener('click', () => openModal(id));
    grid.appendChild(btn);
  });
  main.appendChild(grid);
});

const overlay = document.getElementById('overlay');
const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modalTitle');
const modalEyebrow = document.getElementById('modalEyebrow');
const modalBody = document.getElementById('modalBody');
const modalClose = document.getElementById('modalClose');

function openModal(id){
  const s = sections[id];
  modalEyebrow.textContent = s.eyebrow;
  modalTitle.textContent = s.title;
  modal.classList.toggle('wide', !!s.isPenalCode);
  if(s.isQuiz){
    renderQuizHome(id);
  } else if(s.isPenalCode){
    renderPenalCode();
  } else if(s.isRadioDrill){
    renderRadioHome();
  } else {
    modalBody.innerHTML = s.body;
  }
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  modalClose.focus();
}
function closeModal(){
  overlay.classList.remove('open');
  document.body.style.overflow = '';
}
modalClose.addEventListener('click', closeModal);
overlay.addEventListener('click', e => { if(e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

/* ===== Mastery tracking (persisted per-browser via localStorage) ===== */
const QUIZ_SESSION_SIZE = 10;
const MASTERY_STREAK = 2;
const MASTERY_KEY = 'sasp_quiz_mastery_v1';

function loadMastery(){
  try{
    const raw = localStorage.getItem(MASTERY_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveMastery(data){
  try{ localStorage.setItem(MASTERY_KEY, JSON.stringify(data)); }catch(e){}
}
let masteryData = loadMastery();

function getStat(quizId, idx){
  return (masteryData[quizId] && masteryData[quizId][idx]) || {seen:0, correct:0, streak:0};
}
function setStat(quizId, idx, stat){
  if(!masteryData[quizId]) masteryData[quizId] = {};
  masteryData[quizId][idx] = stat;
  saveMastery(masteryData);
}
function recordResult(quizId, idx, correct){
  const s = getStat(quizId, idx);
  s.seen++;
  if(correct){ s.correct++; s.streak++; } else { s.streak = 0; }
  setStat(quizId, idx, s);
}
function indicesForTier(quizId, tier){
  const out = [];
  quizzes[quizId].forEach((q, idx) => { if(q.tier === tier) out.push(idx); });
  return out;
}
function masteredCount(quizId, tier){
  let n = 0;
  indicesForTier(quizId, tier).forEach(idx => { if(getStat(quizId, idx).streak >= MASTERY_STREAK) n++; });
  return n;
}
function resetMastery(quizId){
  masteryData[quizId] = {};
  saveMastery(masteryData);
}

/* ===== Difficulty tiers ===== */
const TIER_INFO = {
  1: { label:"Small", desc:"Straight recall — the basics you need cold.", color:"var(--green)" },
  2: { label:"Medium", desc:"Applied, on-the-job scenarios.", color:"var(--cyan)" },
  3: { label:"Big", desc:"Compound situations, multiple rules stacked at once.", color:"var(--red)" }
};
const TIER_KEY = 'sasp_quiz_tier_v1';
function loadTierPrefs(){
  try{
    const raw = localStorage.getItem(TIER_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveTierPrefs(data){
  try{ localStorage.setItem(TIER_KEY, JSON.stringify(data)); }catch(e){}
}
let tierPrefs = loadTierPrefs();
function getTier(quizId){
  return tierPrefs[quizId] || 2;
}
function setTier(quizId, tier){
  tierPrefs[quizId] = tier;
  saveTierPrefs(tierPrefs);
}

function shuffleArray(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* Weaker / unseen questions get picked more often; mastered ones fade out but still resurface occasionally. */
function weightFor(stat){
  if(stat.seen === 0) return 6;
  if(stat.streak >= MASTERY_STREAK) return 1;
  const wrong = stat.seen - stat.correct;
  return 3 + wrong * 1.5;
}

function weightedSample(quizId, size, tier){
  const pool = indicesForTier(quizId, tier);
  const bag = pool.map(idx => ({ q: quizzes[quizId][idx], idx, w: weightFor(getStat(quizId, idx)) }));
  const picked = [];
  const n = Math.min(size, bag.length);
  for(let i = 0; i < n; i++){
    const total = bag.reduce((s, x) => s + x.w, 0);
    let r = Math.random() * total;
    let chosen = 0;
    for(let j = 0; j < bag.length; j++){
      r -= bag[j].w;
      if(r <= 0){ chosen = j; break; }
    }
    picked.push(bag[chosen]);
    bag.splice(chosen, 1);
  }
  return picked;
}

function masteryBarHTML(quizId, tier){
  const total = indicesForTier(quizId, tier).length;
  const mastered = masteredCount(quizId, tier);
  const pct = total ? Math.round((mastered / total) * 100) : 0;
  return `
    <div class="mastery-wrap">
      <div class="mastery-row"><span>${TIER_INFO[tier].label} mastery</span><span>${mastered} / ${total} questions · ${pct}%</span></div>
      <div class="mastery-track"><div class="mastery-fill" style="width:${pct}%"></div></div>
    </div>
  `;
}

function tierSelectHTML(quizId){
  const active = getTier(quizId);
  return `
    <div class="tier-select" id="tierSelect">
      ${[1,2,3].map(t => `
        <button class="tier-btn ${t === active ? 'active' : ''}" data-tier="${t}" style="--tier-color:${TIER_INFO[t].color};">
          <span class="tier-btn-label">${TIER_INFO[t].label}</span>
          <span class="tier-btn-count">${indicesForTier(quizId, t).length} Q</span>
        </button>
      `).join('')}
    </div>
    <p class="small-note tier-desc" id="tierDesc">${TIER_INFO[active].desc}</p>
  `;
}

/* ===== Quiz home screen ===== */
function renderQuizHome(quizId){
  const tier = getTier(quizId);
  modalBody.innerHTML = `
    ${tierSelectHTML(quizId)}
    ${masteryBarHTML(quizId, tier)}
    <p class="small-note" style="margin-top:14px;">Missed questions come back around more often; anything you've nailed twice in a row fades out — but still resurfaces now and then so it sticks.</p>
    <div class="quiz-home-actions">
      <button class="quiz-btn" id="qhStart">▶ Start quiz</button>
      <button class="quiz-btn secondary" id="qhFlash">📇 Study flashcards</button>
    </div>
    <button class="quiz-reset-link" id="qhReset">Reset progress on this set</button>
  `;
  document.querySelectorAll('#tierSelect .tier-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      setTier(quizId, Number(btn.getAttribute('data-tier')));
      renderQuizHome(quizId);
    });
  });
  document.getElementById('qhStart').addEventListener('click', () => startQuiz(quizId));
  document.getElementById('qhFlash').addEventListener('click', () => startFlashcards(quizId));
  document.getElementById('qhReset').addEventListener('click', () => {
    if(confirm("Reset your mastery progress for this set? This can't be undone.")){
      resetMastery(quizId);
      renderQuizHome(quizId);
    }
  });
}

/* ===== Quiz session ===== */
let quizState = {quizId:null, tier:2, questions:[], index:0, score:0, answered:false, missed:[]};

function startQuiz(quizId, poolOverride){
  const tier = getTier(quizId);
  const picked = poolOverride || weightedSample(quizId, QUIZ_SESSION_SIZE, tier);
  const questions = picked.map(({q, idx}) => Object.assign({}, q, { origIdx: idx, options: shuffleArray(q.options) }));
  quizState = { quizId, tier, questions, index:0, score:0, answered:false, missed:[] };
  renderQuizQuestion();
}

function quizScoreMessage(score, total, quizId){
  const pct = score / total;
  const topics = {
    quizUnits: "Criminal Activities & Response",
    quizCaselaw: "Case Law",
    quizCodes: "10-Codes & Signals"
  };
  const topic = topics[quizId] || "this topic";
  if(pct === 1) return "Perfect score — you know this cold.";
  if(pct >= 0.75) return "Solid work — a couple worth a second look.";
  if(pct >= 0.5) return `Halfway there — review ${topic}.`;
  return `Worth a re-read of ${topic} before your next shift.`;
}

function renderQuizQuestion(){
  const questions = quizState.questions;
  const total = questions.length;
  if(quizState.index >= total){
    const missed = quizState.missed;
    modalBody.innerHTML = `
      <div class="quiz-score">
        <div class="big">${quizState.score} / ${total}</div>
        <p style="color:var(--ink-dim);">${quizScoreMessage(quizState.score, total, quizState.quizId)}</p>
      </div>
      ${masteryBarHTML(quizState.quizId, quizState.tier)}
      ${missed.length ? `
        <div class="quiz-missed">
          <h3>Worth reviewing (${missed.length})</h3>
          ${missed.map(q => `
            <div class="quiz-missed-item">
              <div class="quiz-missed-prompt">${q.prompt}</div>
              <div class="quiz-missed-answer">Answer: ${q.options.find(o => o.id === q.correct).text}</div>
              <div class="quiz-missed-expl">${q.explanation}</div>
            </div>
          `).join('')}
        </div>
      ` : ''}
      <div class="quiz-nav" style="justify-content:space-between;">
        ${missed.length ? `<button class="quiz-btn secondary" id="quizRetryMissed">Retry missed only</button>` : '<span></span>'}
        <button class="quiz-btn" id="quizHome">Back to overview</button>
      </div>
    `;
    if(missed.length){
      document.getElementById('quizRetryMissed').addEventListener('click', () => {
        const missedPicks = missed.map(q => ({ q: quizzes[quizState.quizId][q.origIdx], idx: q.origIdx }));
        startQuiz(quizState.quizId, missedPicks);
      });
    }
    document.getElementById('quizHome').addEventListener('click', () => renderQuizHome(quizState.quizId));
    return;
  }

  const q = questions[quizState.index];
  quizState.selected = null;
  const qNum = String(quizState.index + 1).padStart(2, '0');
  modalBody.innerHTML = `
    <div class="quiz-progress-row">
      <div class="quiz-progress"><span class="quiz-qnum">Q${qNum}</span> / ${String(total).padStart(2,'0')} &nbsp;·&nbsp; Score ${quizState.score}</div>
      <button class="quiz-shuffle-btn" id="quizExitBtn" title="Back to overview">↩ Overview</button>
    </div>
    <div class="quiz-prompt">${q.prompt}</div>
    ${q.hint ? `<button class="quiz-hint-btn" id="quizHintBtn">Show hint</button><div class="quiz-hint-text" id="quizHintText" style="display:none;">${q.hint}</div>` : ''}
    <div id="quizOptions" class="quiz-options-grid"></div>
    <div class="quiz-nav">
      <button class="quiz-btn" id="quizSubmitBtn" disabled>Submit answer</button>
    </div>
  `;

  document.getElementById('quizExitBtn').addEventListener('click', () => {
    renderQuizHome(quizState.quizId);
  });

  const LETTERS = ['A','B','C','D','E','F'];
  const optionsEl = document.getElementById('quizOptions');
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'quiz-option';
    btn.dataset.optId = opt.id;
    btn.innerHTML = `<span class="quiz-opt-letter">${LETTERS[i]}</span><span class="quiz-opt-text">${opt.text}</span>`;
    btn.addEventListener('click', () => {
      if(quizState.answered) return;
      quizState.selected = opt.id;
      Array.from(optionsEl.children).forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      document.getElementById('quizSubmitBtn').disabled = false;
    });
    optionsEl.appendChild(btn);
  });

  if(q.hint){
    document.getElementById('quizHintBtn').addEventListener('click', () => {
      const t = document.getElementById('quizHintText');
      t.style.display = t.style.display === 'none' ? 'block' : 'none';
    });
  }

  document.getElementById('quizSubmitBtn').addEventListener('click', submitQuizAnswer);
}

function submitQuizAnswer(){
  if(quizState.answered || !quizState.selected) return;
  quizState.answered = true;
  const optId = quizState.selected;
  const q = quizState.questions[quizState.index];
  const correct = optId === q.correct;
  if(correct) quizState.score++; else quizState.missed.push(q);
  recordResult(quizState.quizId, q.origIdx, correct);

  const allBtns = Array.from(document.querySelectorAll('.quiz-option'));
  allBtns.forEach(b => b.classList.add('disabled'));
  const chosenBtn = allBtns.find(b => b.dataset.optId === optId);
  chosenBtn.classList.remove('selected');
  chosenBtn.classList.add(correct ? 'correct' : 'incorrect');
  if(!correct){
    const correctBtn = allBtns.find(b => b.dataset.optId === q.correct);
    correctBtn.classList.add('correct');
  }

  const feedback = document.createElement('div');
  feedback.className = 'quiz-feedback' + (correct ? '' : ' wrong');
  feedback.innerHTML = `<strong>${correct ? (q.correctFeedback || 'Correct.') : (q.incorrectFeedback || 'Not quite.')}</strong> ${q.explanation}`;
  document.getElementById('quizOptions').after(feedback);

  const isLast = quizState.index === quizState.questions.length - 1;
  const submitBtn = document.getElementById('quizSubmitBtn');
  submitBtn.textContent = isLast ? 'See results' : 'Next question';
  submitBtn.disabled = false;
  submitBtn.replaceWith(submitBtn.cloneNode(true));
  document.getElementById('quizSubmitBtn').addEventListener('click', () => {
    quizState.index++;
    quizState.answered = false;
    renderQuizQuestion();
  });
}

/* ===== Flashcards (study mode — weakest cards surface first) ===== */
let flashState = {quizId:null, tier:2, order:[], index:0, flipped:false};

function startFlashcards(quizId){
  const tier = getTier(quizId);
  const withWeights = indicesForTier(quizId, tier).map(idx => ({ idx, w: weightFor(getStat(quizId, idx)) + (Math.random() * 0.75) }));
  withWeights.sort((a, b) => b.w - a.w);
  flashState = { quizId, tier, order: withWeights.map(x => x.idx), index: 0, flipped: false };
  renderFlashcard();
}

function renderFlashcard(){
  const total = flashState.order.length;
  if(flashState.index >= total){
    modalBody.innerHTML = `
      <div class="quiz-score">
        <div class="big">📇</div>
        <p style="color:var(--ink-dim);">Deck complete — nice work.</p>
      </div>
      ${masteryBarHTML(flashState.quizId, flashState.tier)}
      <div class="quiz-nav" style="justify-content:space-between;">
        <button class="quiz-btn secondary" id="fcRestart">Study again</button>
        <button class="quiz-btn" id="fcHome">Back to overview</button>
      </div>
    `;
    document.getElementById('fcRestart').addEventListener('click', () => startFlashcards(flashState.quizId));
    document.getElementById('fcHome').addEventListener('click', () => renderQuizHome(flashState.quizId));
    return;
  }

  const idx = flashState.order[flashState.index];
  const q = quizzes[flashState.quizId][idx];
  const correctText = q.options.find(o => o.id === q.correct).text;

  modalBody.innerHTML = `
    <div class="quiz-progress-row">
      <div class="quiz-progress">Card ${flashState.index + 1} of ${total}</div>
      <button class="quiz-shuffle-btn" id="fcExitBtn" title="Back to overview">↩ Overview</button>
    </div>
    <div class="flashcard ${flashState.flipped ? 'is-flipped' : ''}" id="flashcard">
      <div class="flashcard-face flashcard-front">
        <div class="flashcard-label">Question</div>
        <div class="flashcard-prompt">${q.prompt}</div>
        <div class="flashcard-hint">Tap the card to reveal the answer</div>
      </div>
      <div class="flashcard-face flashcard-back">
        <div class="flashcard-label">Answer</div>
        <div class="flashcard-answer">${correctText}</div>
        <div class="flashcard-expl">${q.explanation}</div>
      </div>
    </div>
    <div class="flashcard-rate" id="flashcardRate" style="${flashState.flipped ? '' : 'visibility:hidden;'}">
      <button class="quiz-btn secondary" id="fcStillLearning">Still learning</button>
      <button class="quiz-btn" id="fcGotIt">Got it ✓</button>
    </div>
  `;

  document.getElementById('fcExitBtn').addEventListener('click', () => renderQuizHome(flashState.quizId));
  document.getElementById('flashcard').addEventListener('click', () => {
    flashState.flipped = !flashState.flipped;
    renderFlashcard();
  });

  if(flashState.flipped){
    document.getElementById('fcStillLearning').addEventListener('click', (e) => {
      e.stopPropagation();
      recordResult(flashState.quizId, idx, false);
      flashState.index++; flashState.flipped = false;
      renderFlashcard();
    });
    document.getElementById('fcGotIt').addEventListener('click', (e) => {
      e.stopPropagation();
      recordResult(flashState.quizId, idx, true);
      flashState.index++; flashState.flipped = false;
      renderFlashcard();
    });
  }
}

  if(c.indexOf("Felony") === 0) return "felony";
  if(c.indexOf("Misdemeanor") === 0) return "misdemeanor";

}

function renderPenalCode(){
  let groupsHTML = "";
  penalCodeData.offenseGroups.forEach((group, gi) => {
    let itemsHTML = "";
    group.items.forEach(item => {
      const tiersHTML = item.tiers.map(t => {
        const labelHTML = t.label ? `<span class="pc-tier-label">${t.label}</span>` : "";
        const ptsHTML = t.pts ? ` · ${t.pts} pts` : "";
        return `<div class="pc-tier">${labelHTML}<span class="pc-class ${pcClassSlug(t.cls)}">${t.cls}</span><span class="pc-tier-stat">${t.months} · ${t.fine}${ptsHTML}</span></div>`;
      }).join("");
      const searchBlob = (item.pc + " " + item.name + " " + item.desc).toLowerCase();
      itemsHTML += `<div class="pc-item" data-search="${searchBlob.replace(/"/g,'&quot;')}">
        <div class="pc-item-head"><span class="pc-num">PC ${item.pc}</span><span class="pc-name">${item.name}</span></div>
        <div class="pc-desc">${item.desc}</div>
        <div class="pc-tiers">${tiersHTML}</div>
      </div>`;
    });
    groupsHTML += `<details class="pc-group" data-kind="offense">
      <summary>${group.title} <span class="pc-count">${group.items.length}</span></summary>
      <div class="pc-group-body">${itemsHTML}</div>
    </details>`;
  });

  penalCodeData.defGroups.forEach(group => {
    let itemsHTML = "";
    group.items.forEach(item => {
      const searchBlob = (item.term + " " + item.body).toLowerCase();
      itemsHTML += `<div class="pc-def" data-search="${searchBlob.replace(/"/g,'&quot;')}">
        <div class="pc-def-term">${item.term}</div>
        <div class="pc-def-body">${item.body}</div>
      </div>`;
    });
    groupsHTML += `<details class="pc-group" data-kind="def">
      <summary>${group.title} <span class="pc-count">${group.items.length}</span></summary>
      <div class="pc-group-body">${itemsHTML}</div>
    </details>`;
  });

  modalBody.innerHTML = `
    <div class="pc-search-wrap">
      <input type="text" class="pc-search" id="pcSearchInput" placeholder="Search by PC number, offense, or keyword…">
    </div>
    <div class="pc-no-results" id="pcNoResults">No matches found.</div>
    <div id="pcGroups">${groupsHTML}</div>
  `;

  document.getElementById('pcSearchInput').addEventListener('input', e => filterPenalCode(e.target.value));
}

function filterPenalCode(query){
  const q = query.trim().toLowerCase();
  let anyVisible = false;
  document.querySelectorAll('#pcGroups .pc-item, #pcGroups .pc-def').forEach(el => {
    const text = el.dataset.search || "";
    const match = q === "" || text.indexOf(q) !== -1;
    el.classList.toggle('pc-row-hidden', !match);
    if(match) anyVisible = true;
  });
  document.querySelectorAll('#pcGroups .pc-group').forEach(g => {
    const visibleItems = g.querySelectorAll('.pc-item:not(.pc-row-hidden), .pc-def:not(.pc-row-hidden)');
    if(q === ""){
      g.open = false;
    } else {
      g.style.display = visibleItems.length ? "" : "none";
      g.open = visibleItems.length > 0;
    }
    if(q === "") g.style.display = "";
  });
  document.getElementById('pcNoResults').style.display = (q !== "" && !anyVisible) ? "block" : "none";
}

  { scenario:"You're dealing with a suspect and can only be reached if it's urgent.", callNumber:"4471", code:"6",
    hint:"This is a middle ground between available and unavailable.", explanation:"10-6 is Busy Unless Urgent." },
  { scenario:"You're heading out of service, off the air, back to the station.", callNumber:"4471", code:"7",
    hint:"This is the opposite of going back on patrol.", explanation:"10-7 is Out of Service." },
  { scenario:"You need to switch the whole channel over to Tac 3.", callNumber:"4471", code:"1",
    hint:"This is the first callout code on the sheet.", explanation:"10-1 is Frequency Change." },
  { scenario:"Dispatch's signal is coming through loud and clear, and you want to confirm that.", callNumber:"4471", code:"2",
    hint:"This confirms signal quality, not message content.", explanation:"10-2 is Signal Good." },
  { scenario:"There's an active pursuit and dispatch needs the channel cleared of all other chatter.", callNumber:"9015", code:"3",
    hint:"This clears the channel for something urgent.", explanation:"10-3 is Stop Transmitting." },
  { scenario:"During a shootout, one of your fellow officers goes down and it's critical.", callNumber:"7712", code:"13A",
    hint:"The 'A' suffix always means urgent — and the person down is an officer.", explanation:"10-13A is Officer Down / URGENT." },
  { scenario:"An officer takes a minor hit during a scuffle — not life-threatening, but worth flagging.", callNumber:"7712", code:"13B",
    hint:"Same situation type as before, but the 'B' suffix means not urgent.", explanation:"10-13B is Officer Down / Not Urgent." },
  { scenario:"During a shootout, your medic gets hit while treating officers right next to you — the medic is the one who's down, not an officer.", callNumber:"7712", code:"14A",
    hint:"Read carefully — who's actually injured here, the officer or the medic?", explanation:"10-14A is Medic Down / URGENT. Even though officers are standing right there, the person actually hurt is the medic, so it's 10-14A — not 10-13A, which is reserved for an officer being the one down." },
  { scenario:"A medic takes a graze during a scene, but it's not serious.", callNumber:"7712", code:"14B",
    hint:"Same situation as before, but not urgent this time.", explanation:"10-14B is Medic Down / Not Urgent." },
  { scenario:"Gunshots are reported in the area and you're calling it in as you approach.", callNumber:"2250", code:"60",
    hint:"This reports what's happening, not your travel status.", explanation:"10-60 is Gunshots." },
  { scenario:"You spot an active robbery in progress and call it in.", callNumber:"2250", code:"90",
    hint:"This is the general code for a robbery in progress.", explanation:"10-90 is Robbery." }
];


const RADIO_CALLSIGN_KEY = 'sasp_radio_callsign_v1';
const RADIO_BEST_KEY = 'sasp_radio_best_v1';
function loadRadioCallsign(){
  try{ return localStorage.getItem(RADIO_CALLSIGN_KEY) || ''; }catch(e){ return ''; }
}
function saveRadioCallsign(v){
  try{ localStorage.setItem(RADIO_CALLSIGN_KEY, v); }catch(e){}
}
function loadRadioBestMap(){
  try{ const raw = localStorage.getItem(RADIO_BEST_KEY); return raw ? JSON.parse(raw) : {}; }catch(e){ return {}; }
}
function loadRadioBest(callsign){
  const map = loadRadioBestMap();
  return (callsign && map[callsign] !== undefined) ? map[callsign] : null;
}
function saveRadioBest(callsign, pct){
  try{
    const map = loadRadioBestMap();
    if(map[callsign] === undefined || pct > map[callsign]){
      map[callsign] = pct;
      localStorage.setItem(RADIO_BEST_KEY, JSON.stringify(map));
    }
  }catch(e){}
}

function cleanToken(t){
  return t.replace(/[^\w-]/g, '').toLowerCase();
}
function tokenize(input){
  return input.split(/\s+/).map(cleanToken).filter(Boolean);
}
function tokenMatchesCode(token, code){
  const c = code.toLowerCase();
  if(token === c) return true;
  if(token === '10-' + c) return true;
  if(token === '10' + c) return true;
  return false;
}

function buildModelAnswer(q, callsign){
  const codeStr = '10-' + q.code;
  if(q.needsCallNumber === false){
    return `${callsign}, ${codeStr}.`;
  }
  return `${callsign}, ${codeStr}, last ${q.callNumber}.`;
}

let radioState = {callsign:'', pool:[], index:0, score:0, wrongCount:0, attempted:0, failed:false, answered:false};

const RADIO_CALLSIGN_OPTIONS = ['767', '522'];

function renderRadioHome(){
  const saved = RADIO_CALLSIGN_OPTIONS.includes(loadRadioCallsign()) ? loadRadioCallsign() : RADIO_CALLSIGN_OPTIONS[0];
  const best = loadRadioBest(saved);
  modalBody.innerHTML = `
    <p class="small-note" style="margin-top:0;">Each scenario describes a situation. Type the full transmission the way you'd actually say it over the radio — callsign, code, and call number. Two wrong answers in a run and the whole set resets from question one.</p>
    <label class="radio-label">Who's running the drill?</label>
    <div class="callsign-select" id="callsignSelect">
      ${RADIO_CALLSIGN_OPTIONS.map(cs => `<button class="callsign-btn ${cs === saved ? 'active' : ''}" data-cs="${cs}">${cs}</button>`).join('')}
    </div>
    ${best !== null ? `<p class="small-note">Best clean run for ${saved}: <strong style="color:var(--green);">${best}%</strong></p>` : ''}
    <div class="quiz-home-actions">
      <button class="quiz-btn" id="radioStartBtn">▶ Start drill (${RADIO_DRILL.length} scenarios)</button>
    </div>
  `;
  document.querySelectorAll('#callsignSelect .callsign-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      saveRadioCallsign(btn.getAttribute('data-cs'));
      renderRadioHome();
    });
  });
  document.getElementById('radioStartBtn').addEventListener('click', () => {
    startRadioDrill(saved);
  });
}

function startRadioDrill(callsign){
  radioState = {
    callsign,
    pool: shuffleArray(RADIO_DRILL),
    index: 0,
    score: 0,
    wrongCount: 0,
    attempted: 0,
    failed: false,
    answered: false
  };
  renderRadioQuestion();
}

function renderRadioResults(){
  const attempted = radioState.attempted;
  const pct = attempted ? Math.round((radioState.score / attempted) * 100) : 0;
  const passed = !radioState.failed;
  if(passed) saveRadioBest(radioState.callsign, pct);
  modalBody.innerHTML = `
    <div class="quiz-score">
      <div class="radio-banner ${passed ? 'pass' : 'fail'}">${passed ? '✓ CLEAN RUN' : '✕ CHANNEL RESET'}</div>
      <div class="big">${radioState.score} / ${attempted}</div>
      <p style="color:var(--ink-dim);">${pct}% correct${passed ? ' — full set completed with ' + radioState.wrongCount + ' miss' + (radioState.wrongCount===1?'':'es') + '.' : ' — two wrong answers, run stopped at question ' + attempted + ' of ' + radioState.pool.length + '.'}</p>
    </div>
    <div class="quiz-nav" style="justify-content:space-between;">
      <button class="quiz-btn secondary" id="radioExitBtn">Exit</button>
      <button class="quiz-btn" id="radioRetryBtn">${passed ? 'Run it again' : 'Try again from the top'}</button>
    </div>
  `;
  document.getElementById('radioExitBtn').addEventListener('click', () => renderRadioHome());
  document.getElementById('radioRetryBtn').addEventListener('click', () => startRadioDrill(radioState.callsign));
}

function renderRadioQuestion(){
  if(radioState.failed || radioState.index >= radioState.pool.length){
    renderRadioResults();
    return;
  }
  const q = radioState.pool[radioState.index];
  radioState.answered = false;
  const qNum = String(radioState.index + 1).padStart(2, '0');
  modalBody.innerHTML = `
    <div class="quiz-progress-row">
      <div class="quiz-progress"><span class="quiz-qnum">Q${qNum}</span> / ${String(radioState.pool.length).padStart(2,'0')} &nbsp;·&nbsp; Score ${radioState.score} &nbsp;·&nbsp; Misses ${radioState.wrongCount}/2</div>
      <button class="quiz-shuffle-btn" id="radioExitMidBtn" title="Stop and exit">↩ Stop</button>
    </div>
    <div class="quiz-prompt">${q.scenario}</div>
    ${q.needsCallNumber === false ? '' : `<div class="radio-callcard">Call # on record: <strong>${q.callNumber}</strong></div>`}
    <button class="quiz-hint-btn" id="radioHintBtn">Show hint</button>
    <div class="quiz-hint-text" id="radioHintText" style="display:none;">${q.hint}</div>
    <input type="text" id="radioAnswerInput" class="radio-input" placeholder="Type exactly what you'd say over the radio..." autocomplete="off">
    <div class="quiz-nav">
      <button class="quiz-btn" id="radioSubmitBtn">Submit transmission</button>
    </div>
  `;
  document.getElementById('radioExitMidBtn').addEventListener('click', () => renderRadioHome());
  document.getElementById('radioHintBtn').addEventListener('click', () => {
    const t = document.getElementById('radioHintText');
    t.style.display = t.style.display === 'none' ? 'block' : 'none';
  });
  const input = document.getElementById('radioAnswerInput');
  input.focus();
  input.addEventListener('keydown', e => { if(e.key === 'Enter') submitRadioAnswer(); });
  document.getElementById('radioSubmitBtn').addEventListener('click', submitRadioAnswer);
}

function submitRadioAnswer(){
  if(radioState.answered) return;
  const q = radioState.pool[radioState.index];
  const raw = document.getElementById('radioAnswerInput').value || '';
  const tokens = tokenize(raw);
  const codeOk = tokens.some(t => tokenMatchesCode(t, q.code));
  const callNumberOk = q.needsCallNumber === false ? true : tokens.includes(cleanToken(q.callNumber));
  const callsignOk = raw.toLowerCase().includes(radioState.callsign.toLowerCase());
  const correct = codeOk && callNumberOk && callsignOk;

  radioState.answered = true;
  radioState.attempted++;
  if(correct){
    radioState.score++;
  } else {
    radioState.wrongCount++;
    if(radioState.wrongCount >= 2) radioState.failed = true;
  }

  const modelAnswer = buildModelAnswer(q, radioState.callsign);
  const rows = [
    { label:'Callsign', ok: callsignOk },
    { label:'Code', ok: codeOk },
  ];
  if(q.needsCallNumber !== false) rows.push({ label:'Call number', ok: callNumberOk });

  const feedback = document.createElement('div');
  feedback.className = 'quiz-feedback' + (correct ? '' : ' wrong');
  feedback.innerHTML = `
    <strong>${correct ? 'Correct.' : 'Not quite.'}</strong> ${q.explanation}
    <div class="radio-check-rows">
      ${rows.map(r => `<span class="radio-check-row ${r.ok ? 'ok' : 'bad'}">${r.ok ? '✓' : '✗'} ${r.label}</span>`).join('')}
    </div>
    <div class="radio-model-answer">Model: "${modelAnswer}"</div>
  `;
  document.getElementById('radioAnswerInput').disabled = true;
  document.getElementById('radioAnswerInput').after(feedback);

  const submitBtn = document.getElementById('radioSubmitBtn');
  const isLastInRun = radioState.failed || radioState.index === radioState.pool.length - 1;
  submitBtn.textContent = isLastInRun ? 'See results' : 'Next scenario';
  submitBtn.replaceWith(submitBtn.cloneNode(true));
  document.getElementById('radioSubmitBtn').addEventListener('click', () => {
    radioState.index++;
    renderRadioQuestion();
  });
}

</script>
